<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Indiana Spice POS</title>
<meta name="theme-color" content="#17130f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Indiana POS">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Hind:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* Layout: sidebar + work area on desktop, top bar + bottom tabs on phones. Black menu-board ink, saffron for money and actions. */
:root{
  --bg:#f4f3f0; --surface:#ffffff; --surface-2:#faf9f6; --ink:#17130f; --muted:#6c655c; --line:#e3dfd7;
  --accent:#f2b705; --accent-ink:#1d1600; --accent-soft:#fdf3cf;
  --chili:#c2361b; --chili-soft:#fbe7e2; --good:#2c7a4b; --good-soft:#e2f2e8; --warn:#9a6a08; --warn-soft:#fbf0d6;
  --side:#17130f; --side-ink:#f3efe8; --side-muted:#a39b90;
  --f-display:"Rozha One", Georgia, "Times New Roman", serif;
  --f-body:"Hind", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:10px; --tab-h:62px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121110; --surface:#1c1a17; --surface-2:#232019; --ink:#f3efe8; --muted:#a39b90; --line:#332f29;
  --accent:#f5c22b; --accent-ink:#1d1600; --accent-soft:#3a3013;
  --chili:#e86a4c; --chili-soft:#3b1f18; --good:#5bb784; --good-soft:#18301f; --warn:#e0a93a; --warn-soft:#352a12;
  --side:#0b0a09; --side-ink:#f3efe8; --side-muted:#8f877c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121110; --surface:#1c1a17; --surface-2:#232019; --ink:#f3efe8; --muted:#a39b90; --line:#332f29;
  --accent:#f5c22b; --accent-ink:#1d1600; --accent-soft:#3a3013;
  --chili:#e86a4c; --chili-soft:#3b1f18; --good:#5bb784; --good-soft:#18301f; --warn:#e0a93a; --warn-soft:#352a12;
  --side:#0b0a09; --side-ink:#f3efe8; --side-muted:#8f877c; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- buttons & fields ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);
  border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:40px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
a.btn{text-decoration:none;color:inherit}
#rp{display:flex;flex-direction:column;gap:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(.96)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.danger{color:var(--chili);border-color:var(--chili)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;min-height:40px}
.input:focus{border-color:var(--ink);outline:none}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:6px;padding:7px 8px;font-weight:600;cursor:pointer;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--chili-soft);color:var(--chili)}
.pill.mute{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* ---------- auth ---------- */
.auth{min-height:100%;display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--side);color:var(--side-ink)}
.auth-card{width:100%;max-width:380px;background:var(--surface);color:var(--ink);border-radius:14px;padding:28px 24px;display:flex;flex-direction:column;gap:14px}
.brand{font-family:var(--f-display);font-size:30px;line-height:1;letter-spacing:.01em}
.brand small{display:block;font-family:var(--f-body);font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;margin-top:6px;opacity:.7}
.auth-head{text-align:center;padding-bottom:6px;border-bottom:1px dashed var(--line)}
.err{background:var(--chili-soft);color:var(--chili);padding:8px 11px;border-radius:8px;font-size:14px}
.note{background:var(--accent-soft);padding:8px 11px;border-radius:8px;font-size:14px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:220px 1fr;height:100%}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:20px 12px;gap:4px;overflow:auto}
.side .brand{padding:0 10px 18px;font-size:26px}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;color:var(--side-muted);text-decoration:none;font-weight:600;border:0;background:none;cursor:pointer;text-align:left;width:100%}
.nav svg{width:20px;height:20px;flex:none}
.nav:hover{color:var(--side-ink);background:rgba(255,255,255,.06)}
.nav.on{color:var(--accent-ink);background:var(--accent)}
.whoami{margin-top:auto;padding:12px;border-top:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;gap:2px;font-size:14px}
.whoami .r{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.whoami button{margin-top:8px;align-self:flex-start;background:none;border:1px solid rgba(255,255,255,.2);color:var(--side-ink);border-radius:7px;padding:5px 10px;cursor:pointer;font-size:13px}
main{min-width:0;overflow:auto;position:relative}
.topbar,.tabbar{display:none}
.page{padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.page-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.page-head h1{font-family:var(--f-display);font-size:30px;line-height:1.05;font-weight:400}
.page-head .sub{color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.card-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:15px;font-weight:700}
.card-b{padding:14px 16px}

@media (max-width:860px){
  .shell{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .side{display:none}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--side)}
  .topbar{display:flex;align-items:center;gap:10px;background:var(--side);color:var(--side-ink);padding-block:10px;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
  .topbar .brand{font-size:21px}
  .topbar .who{margin-left:auto;font-size:13px;color:var(--side-muted);text-align:right;line-height:1.2}
  .topbar .who b{color:var(--side-ink);display:block}
  main{padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px))}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabbar button{flex:1;height:var(--tab-h);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer}
  .tabbar svg{width:22px;height:22px}
  .tabbar button.on{color:var(--ink)}
  .tabbar button.on svg{color:var(--warn)}
  .page{padding-block:16px 28px}
  .page-head h1{font-size:25px}
}

/* ---------- sell ---------- */
.sell{display:grid;grid-template-columns:1fr 380px;height:100%;min-height:0}
.catalog{min-width:0;overflow:auto;padding-block:18px 30px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:14px}
.catbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.catbar .input{max-width:260px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-weight:600;cursor:pointer;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cat-title{font-family:var(--f-display);font-size:21px;font-weight:400;display:flex;align-items:center;gap:10px;margin-top:4px}
.cat-title::after{content:"";flex:1;border-top:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.prod{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;
  display:flex;flex-direction:column;gap:6px;min-height:104px;transition:border-color .12s, transform .08s}
.prod:hover{border-color:var(--ink)}
.prod:active{transform:scale(.98)}
.prod .nm{font-weight:700;line-height:1.2;font-size:15px}
.prod .pr{margin-top:auto;font-weight:700;font-size:16px}
.prod .pr span{color:var(--muted);font-weight:500;font-size:13px}
.prod .tag{align-self:flex-start}
.prod .incart{position:absolute;bottom:10px;right:10px;background:var(--accent);color:var(--accent-ink);border-radius:99px;min-width:24px;height:24px;display:grid;place-items:center;font-weight:700;font-size:13px;padding:0 6px}
.cart{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.cart-h{padding:16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.cart-h h2{font-family:var(--f-display);font-weight:400;font-size:22px}
.cart-lines{flex:1;overflow:auto;padding:4px 16px}
.cline{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.cline .n{font-weight:600;line-height:1.25}
.cline .v{font-size:13px;color:var(--muted)}
.cline .t{font-weight:700;text-align:right}
.stepper{justify-self:start;display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stepper button{width:32px;height:30px;border:0;background:var(--surface-2);cursor:pointer;font-size:17px;font-weight:700}
.stepper span{min-width:30px;text-align:center;font-weight:700}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:14px}
.checkout{border-top:1px solid var(--line);padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2);overflow:auto;max-height:62%}
.totals{display:flex;flex-direction:column;gap:3px;font-size:14px}
.totals div{display:flex;justify-content:space-between}
.totals .grand{font-size:22px;font-weight:700;padding-top:6px;border-top:1px solid var(--line);margin-top:4px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{flex:1;min-width:56px}
.change{display:flex;justify-content:space-between;font-weight:700;font-size:15px;padding:8px 10px;border-radius:8px;background:var(--good-soft);color:var(--good)}
.change.short{background:var(--chili-soft);color:var(--chili)}
.charge{min-height:52px;font-size:18px}
.cart-pay{padding:10px 16px 14px;border-top:1px solid var(--line);background:var(--surface-2)}
.cart-pay .charge{width:100%}
.cartfab{display:none}
.cart-close{display:none}
@media (max-width:1060px){.sell{grid-template-columns:1fr 340px}}
@media (max-width:860px){
  .sell{display:block;height:auto}
  .catalog{padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:90px;overflow:visible}
  .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .catbar .input{max-width:none;flex:1 1 100%}
  .cart{position:fixed;inset:0;z-index:40;border:0;transform:translateY(100%);transition:transform .22s ease;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .cart.open{transform:none}
  .cart-close{display:inline-flex}
  .checkout{max-height:none;flex:none}
  .cart-lines{min-height:80px}
  .cart.open .cart-scroll{overflow:auto}
  .cartfab{display:flex;position:fixed;z-index:24;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));
    bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 10px);background:var(--ink);color:var(--bg);border:0;border-radius:12px;padding:14px 16px;font-weight:700;font-size:16px;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);cursor:pointer}
  .cartfab .amt{margin-left:auto;color:var(--accent)}
}
.cart-scroll{display:flex;flex-direction:column;flex:1;min-height:0}
@media (max-width:860px){.cart-scroll{overflow:auto}}

/* ---------- tables & lists ---------- */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
.void-row td{color:var(--muted);text-decoration:line-through}
.void-row td.keep{text-decoration:none}
.list-m{display:none}
@media (max-width:700px){
  .tbl-wrap.resp{display:none}
  .list-m{display:flex;flex-direction:column}
  .li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%}
  .li:last-child{border-bottom:0}
  .li .a{font-weight:700}
  .li .b{font-size:13px;color:var(--muted)}
  .li .c{text-align:right;font-weight:700}
}

/* ---------- KPIs & charts ---------- */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font-size:23px;font-weight:700;line-height:1.15}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.hero{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kpi.hero .k,.kpi.hero .s{color:inherit;opacity:.7}
.kpi.hero .v{color:var(--accent)}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi.hero{grid-column:1/-1}}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:1000px){.two,.three{grid-template-columns:1fr}}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font:11px var(--f-body)}
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;font-size:14px}
.bar-row .track{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar-row .fill{height:100%;background:var(--accent)}
.bar-row .fill.ink{background:var(--ink)}
.rangebar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- modal & toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,8,6,.55);z-index:60;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:520px;max-height:calc(100% - 20px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal.wide{max-width:760px}
.modal-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-h h2{font-family:var(--f-display);font-weight:400;font-size:22px}
.modal-b{padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:600px){.overlay{place-items:end stretch;padding:0}.modal{max-width:none;border-radius:16px 16px 0 0;max-height:92%;padding-bottom:env(safe-area-inset-bottom,0px)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.toast.bad{background:var(--chili);color:#fff}
@media (max-width:860px){.toast{bottom:calc(var(--tab-h) + 80px + env(safe-area-inset-bottom,0px))}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
.variant-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.variant-pick button{padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.variant-pick button:hover{border-color:var(--ink)}
.variant-pick b{font-size:18px}
.vblock{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.vgrid{display:grid;grid-template-columns:1fr 110px auto auto;gap:8px;align-items:end}
.rgrid{display:grid;grid-template-columns:1fr 90px auto;gap:6px;align-items:center}
@media (max-width:480px){.vgrid{grid-template-columns:1fr 90px}}

/* ---------- receipt ---------- */
.receipt{font-family:var(--f-mono);font-size:13px;line-height:1.5;background:#fff;color:#111;border:1px solid var(--line);border-radius:8px;padding:16px;max-width:320px;margin:0 auto;width:100%}
.receipt .c{text-align:center}
.receipt .t{font-family:var(--f-display);font-size:22px;line-height:1.1}
.receipt hr{border:0;border-top:1px dashed #999;margin:8px 0}
.receipt .l{display:flex;justify-content:space-between;gap:8px}
.receipt .big{font-weight:600;font-size:15px}
#print{display:none}
@media print{
  @page{size:58mm auto;margin:2mm}
  body{background:#fff}
  #app,.overlay,.toast,body::before{display:none!important}
  #print{display:block}
  #print .receipt{border:0;max-width:none;padding:0;font-size:11px}
}
</style>
</head>
<body>
<div id="app"><div class="auth"><div class="brand" style="color:var(--side-ink)">Indiana Spice<small>Loading POS…</small></div></div></div>
<div id="print"></div>
<script>
/* ===================== config ===================== */

/* ===================== utils ===================== */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const peso = (n, dec=2) => '₱' + Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:dec,maximumFractionDigits:dec});
const pesoShort = n => Number(n) % 1 === 0 ? peso(n,0) : peso(n);
const qtyFmt = n => Number(n) % 1 === 0 ? Number(n).toLocaleString('en-PH') : Number(n).toLocaleString('en-PH',{maximumFractionDigits:2});
const manilaDate = (d=new Date()) => new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
const dayStart = ds => new Date(ds + 'T00:00:00+08:00');
const addDays = (ds, n) => manilaDate(new Date(dayStart(ds).getTime() + n*864e5 + 12*36e5));
const fmtTime = iso => new Date(iso).toLocaleTimeString('en-PH',{timeZone:TZ,hour:'numeric',minute:'2-digit'});
const fmtDT = iso => new Date(iso).toLocaleString('en-PH',{timeZone:TZ,month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});
const fmtDay = ds => dayStart(ds).toLocaleDateString('en-PH',{timeZone:TZ,weekday:'short',month:'short',day:'numeric'});
const hourOf = iso => Number(new Intl.DateTimeFormat('en-GB',{timeZone:TZ,hour:'2-digit',hour12:false}).format(new Date(iso))) % 24;
const isAdmin = () => S.me?.role === 'admin';
const nameOf = id => S.profiles.find(p => p.id === id)?.full_name || '—';
const round2 = n => Math.round(n*100)/100;

function toast(msg, bad=false){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t = document.createElement('div'); t.className = 'toast' + (bad?' bad':''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), bad?4200:2600);
}
function errMsg(e){ return e?.message || e?.error_description || String(e); }
async function q(promise){ const { data, error } = await promise; if (error) throw error; return data; }

const ICON = {
  sell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16l-1.5 11a2 2 0 0 1-2 1.8H7.5a2 2 0 0 1-2-1.8z"/><path d="M8.5 7a3.5 3.5 0 0 1 7 0"/></svg>',
  sales:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>',
  inventory:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>',
  menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v8a3 3 0 0 0 3 3v7M8 3v7M11 3v8a3 3 0 0 1-3 3"/><path d="M17 21V3c-2 1.5-3 4-3 7s1 4 3 4"/></svg>',
  reports:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  staff:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17.5" cy="9" r="2.5"/><path d="M16 14.2a5 5 0 0 1 5.5 5.8"/></svg>',
  more:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>'
};
const VIEWS = {
  sell:{ label:'Sell', roles:['admin','sales'] },
  sales:{ label:'Sales', salesLabel:'My Sales', roles:['admin','sales'] },
  inventory:{ label:'Inventory', salesLabel:'Stock', roles:['admin','sales'] },
  menu:{ label:'Menu', roles:['admin'] },
  reports:{ label:'Reports', roles:['admin'] },
  staff:{ label:'Staff', roles:['admin'] },
  more:{ label:'More', roles:['admin','sales'], mobileOnly:true }
};
const viewLabel = v => (!isAdmin() && VIEWS[v].salesLabel) || VIEWS[v].label;
const canSee = v => VIEWS[v] && VIEWS[v].roles.includes(S.me.role);

/* ===================== auth ===================== */
async function callStaff(body){
  const { data, error } = await sb.functions.invoke('staff', { body });
  if (error){ let m = error.message; try { const j = await error.context.json(); m = j.error || m; } catch(_){} throw new Error(m); }
  if (data?.error) throw new Error(data.error);
  return data;
}
async function showAuth(msg){
  let setup = false;
  try { setup = (await callStaff({ action:'status' })).needsSetup; } catch(_){}
  app.innerHTML = `<div class="auth"><form class="auth-card" id="authForm" novalidate>
    <div class="auth-head"><div class="brand">Indiana Spice<small>Point of Sale</small></div></div>
    ${setup ? `<div class="note">First time here. Create the <b>owner / admin</b> account. You can add Sales Officers after you sign in.</div>
      <div class="field"><label for="a_name">Your name</label><input class="input" id="a_name" autocomplete="name" required></div>` : ''}
    ${msg ? `<div class="err">${esc(msg)}</div>` : '<div class="err" id="authErr" hidden></div>'}
    <div class="field"><label for="a_user">Username</label><input class="input" id="a_user" autocapitalize="none" autocomplete="username" required></div>
    <div class="field"><label for="a_pass">Password</label><input class="input" id="a_pass" type="password" autocomplete="${setup?'new-password':'current-password'}" required></div>
    <button class="btn primary charge" type="submit" id="a_go">${setup ? 'Create admin account' : 'Sign in'}</button>
    <div class="muted" style="font-size:13px;text-align:center">${setup ? 'Use at least 6 characters for the password.' : 'Forgot your password? Ask the admin to reset it.'}</div>
  </form></div>`;
  document.getElementById('authForm').onsubmit = async e => {
    e.preventDefault();
    const btn = document.getElementById('a_go'); btn.disabled = true;
    const user = document.getElementById('a_user').value.trim().toLowerCase();
    const pass = document.getElementById('a_pass').value;
    const showErr = m => { let el = document.getElementById('authErr') || document.querySelector('.auth .err'); el.hidden = false; el.textContent = m; btn.disabled = false; };
    try {
      if (setup) await callStaff({ action:'create', username:user, password:pass, full_name:document.getElementById('a_name').value.trim() });
      const { error } = await sb.auth.signInWithPassword({ email:`${user}@${LOGIN_DOMAIN}`, password:pass });
      if (error) throw new Error(/invalid/i.test(error.message) ? 'Wrong username or password.' : /banned/i.test(error.message) ? 'This account is deactivated. Ask the admin.' : error.message);
      boot();
    } catch(err){ showErr(errMsg(err)); }
  };
}
async function signOut(){ await sb.auth.signOut(); S.me = null; S.cart = []; location.hash = ''; showAuth(); }

/* ===================== data ===================== */
async function loadCatalog(){
  const [p, v, i, r, pr] = await Promise.all([
    q(sb.from('products').select('*').order('category').order('sort')),
    q(sb.from('variants').select('*').order('sort')),
    q(sb.from('inventory_items').select('*').order('name')),
    q(sb.from('recipes').select('*')),
    q(sb.from('profiles').select('*').order('full_name'))
  ]);
  S.products = p; S.variants = v; S.items = i; S.recipes = r; S.profiles = pr;
}
async function refreshStock(){ S.items = await q(sb.from('inventory_items').select('*').order('name')); }
const variantsOf = pid => S.variants.filter(v => v.product_id === pid);
const itemById = id => S.items.find(i => i.id === id);
function servingsLeft(variantId){
  const rs = S.recipes.filter(r => r.variant_id === variantId);
  if (!rs.length) return null;
  return Math.min(...rs.map(r => { const it = itemById(r.item_id); return it ? Math.floor(Number(it.qty) / Number(r.qty)) : Infinity; }));
}
function stockStatus(it){
  const qn = Number(it.qty), rl = Number(it.reorder_level);
  if (qn <= 0) return ['Out','bad'];
  if (qn <= rl) return ['Low','warn'];
  return ['OK','good'];
}

/* ===================== shell ===================== */
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) return showAuth();
  try {
    const me = await q(sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle());
    if (!me || !me.active){ await sb.auth.signOut(); return showAuth('This account is deactivated. Ask the admin.'); }
    S.me = me;
    await loadCatalog();
  } catch(e){ return showAuth('Could not load the POS: ' + errMsg(e)); }
  renderShell();
  route();
}
function renderShell(){
  const desk = Object.keys(VIEWS).filter(v => canSee(v) && !VIEWS[v].mobileOnly);
  const mob = isAdmin() ? ['sell','sales','inventory','reports','more'] : ['sell','sales','inventory','more'];
  app.innerHTML = `<div class="shell">
    <aside class="side">
      <div class="brand">Indiana Spice<small>POS · ${isAdmin()?'Admin':'Sales Officer'}</small></div>
      ${desk.map(v => `<a class="nav" href="#${v}" data-nav="${v}">${ICON[v]}<span>${viewLabel(v)}</span></a>`).join('')}
      <div class="whoami"><span class="r">${isAdmin()?'Admin':'Sales Officer'}</span><b>${esc(S.me.full_name)}</b><span style="color:var(--side-muted)">@${esc(S.me.username)}</span>
        <button data-act="signout">Sign out</button></div>
    </aside>
    <div class="topbar"><div class="brand">Indiana Spice</div><div class="who"><b>${esc(S.me.full_name)}</b>${isAdmin()?'Admin':'Sales Officer'}</div></div>
    <main id="main"></main>
    <nav class="tabbar">${mob.map(v => `<button data-nav="${v}">${ICON[v]}<span>${viewLabel(v)}</span></button>`).join('')}</nav>
  </div>`;
}
function route(){
  let v = (location.hash || '#sell').slice(1);
  if (!canSee(v)) v = 'sell';
  if (v === 'more' && window.innerWidth > 860) v = 'sell';
  S.view = v;
  document.querySelectorAll('[data-nav]').forEach(b => b.classList.toggle('on', b.dataset.nav === v || (v==='menu'||v==='staff') && b.dataset.nav==='more' && b.closest('.tabbar')));
  const main = document.getElementById('main'); main.scrollTop = 0;
  ({ sell:viewSell, sales:viewSales, inventory:viewInventory, menu:viewMenu, reports:viewReports, staff:viewStaff, more:viewMore })[v]();
}
window.addEventListener('hashchange', () => S.me && route());
const main = () => document.getElementById('main');

/* ===================== SELL ===================== */
function viewSell(){
  main().innerHTML = `<div class="sell">
    <section class="catalog">
      <div class="catbar">
        <input class="input" id="s_q" type="search" placeholder="Search menu" value="${esc(S.q)}" autocomplete="off">
        ${['All',...CATS].map(c => `<button class="chip ${S.cat===c?'on':''}" data-act="cat" data-v="${c}">${c}</button>`).join('')}
      </div>
      <div id="prodList"></div>
    </section>
    <aside class="cart ${S.cartOpen?'open':''}" id="cart"></aside>
  </div>
  <button class="cartfab" id="cartfab" data-act="opencart"></button>`;
  document.getElementById('s_q').oninput = e => { S.q = e.target.value; renderProducts(); };
  renderProducts(); renderCart();
}
function renderProducts(){
  const term = S.q.trim().toLowerCase();
  const cats = S.cat === 'All' ? CATS : [S.cat];
  let html = '';
  for (const c of cats){
    const ps = S.products.filter(p => p.active && p.category === c && (!term || p.name.toLowerCase().includes(term)) && variantsOf(p.id).some(v=>v.active));
    if (!ps.length) continue;
    html += `<h2 class="cat-title">${c}</h2><div class="grid">` + ps.map(p => {
      const vs = variantsOf(p.id).filter(v => v.active);
      const left = vs.map(v => servingsLeft(v.id)).filter(x => x !== null);
      const min = left.length ? Math.min(...left) : null;
      const tag = min === null ? '' : min <= 0 ? '<span class="pill bad tag">Out of stock</span>' : min <= 5 ? `<span class="pill warn tag">${min} left</span>` : '';
      const inCart = S.cart.filter(l => vs.some(v => v.id === l.variant_id)).reduce((a,l) => a + l.qty, 0);
      const price = vs.length === 1 ? pesoShort(vs[0].price) : vs.map(v => `<span>${esc(v.label)}</span> ${pesoShort(v.price)}`).join('<span> · </span>');
      return `<button class="prod" data-act="pick" data-pid="${p.id}"><span class="nm">${esc(p.name)}</span>${tag}<span class="pr num">${price}</span>${inCart?`<span class="incart num">${inCart}</span>`:''}</button>`;
    }).join('') + '</div>';
  }
  document.getElementById('prodList').innerHTML = html || '<div class="empty">No menu items match. Clear the search or pick another category.</div>';
}
function addToCart(variantId){
  const v = S.variants.find(x => x.id === variantId); const p = S.products.find(x => x.id === v.product_id);
  const line = S.cart.find(l => l.variant_id === variantId);
  if (line) line.qty++; else S.cart.push({ variant_id:v.id, name:p.name, label:v.label, price:Number(v.price), qty:1 });
  const left = servingsLeft(variantId);
  if (left !== null && (line?.qty || 1) > left) toast(`Heads up: stock shows only ${Math.max(left,0)} left for ${p.name}${v.label?' '+v.label:''}.`);
  renderProducts(); renderCart();
}
function cartTotals(){
  const sub = round2(S.cart.reduce((a,l) => a + l.qty*l.price, 0));
  let disc = 0;
  if (S.co.discType === 'senior_pwd') disc = round2(sub*0.20);
  else if (S.co.discType === 'promo') disc = Math.min(Math.max(Number(S.co.discAmt)||0,0), sub);
  const total = round2(sub - disc);
  const tendered = S.co.method === 'Cash' ? Number(S.co.tendered)||0 : total;
  return { sub, disc, total, tendered, change: round2(tendered - total), count:S.cart.reduce((a,l)=>a+l.qty,0) };
}
function renderCart(){
  const el = document.getElementById('cart'); if (!el) return;
  const t = cartTotals(); const co = S.co;
  const fab = document.getElementById('cartfab');
  fab.hidden = !S.cart.length;
  fab.innerHTML = `<span>View order · ${t.count} item${t.count===1?'':'s'}</span><span class="amt num">${peso(t.total)}</span>`;
  const quickCash = [...new Set([t.total, Math.ceil(t.total/100)*100, Math.ceil(t.total/500)*500, 1000])].filter(x => x >= t.total && x > 0).slice(0,4);
  el.innerHTML = `
    <div class="cart-h"><h2>Current order</h2><span class="spacer"></span>
      ${S.cart.length ? '<button class="btn ghost sm" data-act="clearcart">Clear</button>' : ''}
      <button class="btn sm cart-close" data-act="closecart">Close</button></div>
    <div class="cart-scroll">
    <div class="cart-lines">${S.cart.length ? S.cart.map((l,i) => `
      <div class="cline"><div><div class="n">${esc(l.name)}</div><div class="v num">${l.label?esc(l.label)+' · ':''}${pesoShort(l.price)} each</div></div>
        <div class="t num">${peso(l.qty*l.price)}</div>
        <div class="stepper"><button data-act="dec" data-i="${i}" aria-label="Less">−</button><span class="num">${l.qty}</span><button data-act="inc" data-i="${i}" aria-label="More">+</button></div>
        <div style="text-align:right"><button class="btn ghost sm" data-act="rm" data-i="${i}">Remove</button></div></div>`).join('')
      : '<div class="empty">Tap a menu item to start an order.</div>'}</div>
    <div class="checkout">
      <div class="seg" role="group" aria-label="Order type">${['Dine-in','Take-out','Delivery'].map(x => `<button data-act="co" data-k="orderType" data-v="${x}" class="${co.orderType===x?'on':''}">${x}</button>`).join('')}</div>
      <input class="input" id="co_customer" placeholder="Customer name or table no. (optional)" value="${esc(co.customer)}">
      <div class="field"><span class="lbl">Discount</span>
        <div class="seg">${[['none','None'],['senior_pwd','Senior / PWD 20%'],['promo','Promo ₱']].map(([k,l]) => `<button data-act="co" data-k="discType" data-v="${k}" class="${co.discType===k?'on':''}">${l}</button>`).join('')}</div></div>
      ${co.discType==='senior_pwd' ? `<input class="input" id="co_discRef" placeholder="Senior Citizen / PWD ID number" value="${esc(co.discRef)}">` : ''}
      ${co.discType==='promo' ? `<input class="input num" id="co_discAmt" type="number" inputmode="decimal" min="0" placeholder="Discount amount (₱)" value="${esc(co.discAmt)}">` : ''}
      <div class="totals num">
        <div><span>Subtotal</span><span>${peso(t.sub)}</span></div>
        ${t.disc ? `<div style="color:var(--good)"><span>Discount</span><span>−${peso(t.disc)}</span></div>` : ''}
        <div class="grand"><span>Total</span><span>${peso(t.total)}</span></div>
      </div>
      <div class="seg" role="group" aria-label="Payment">${['Cash','GCash','Maya'].map(x => `<button data-act="co" data-k="method" data-v="${x}" class="${co.method===x?'on':''}">${x}</button>`).join('')}</div>
      ${co.method==='Cash' ? `
        <input class="input num" id="co_tendered" type="number" inputmode="decimal" min="0" placeholder="Cash received (₱)" value="${esc(co.tendered)}">
        ${S.cart.length ? `<div class="quick">${quickCash.map(x => `<button class="btn sm num" data-act="cash" data-v="${x}">${x===t.total?'Exact':pesoShort(x)}</button>`).join('')}</div>` : ''}
        ${co.tendered!=='' && S.cart.length ? `<div class="change num ${t.change<0?'short':''}"><span>${t.change<0?'Short by':'Change'}</span><span>${peso(Math.abs(t.change))}</span></div>` : ''}`
      : `<input class="input" id="co_payRef" placeholder="${co.method} reference no. (optional)" value="${esc(co.payRef)}">`}
    </div></div>
    <div class="cart-pay"><button class="btn primary charge num" data-act="charge" ${!S.cart.length || (co.method==='Cash' && t.change<0) || (co.method==='Cash' && co.tendered==='') ? 'disabled':''}>Charge ${peso(t.total)}</button></div>`;
  const bind = (id, key, rerender) => { const i = document.getElementById(id); if (i) i.oninput = e => { S.co[key] = e.target.value; if (rerender) { const pos = e.target.selectionStart; renderCart(); const n = document.getElementById(id); n.focus(); try{ n.setSelectionRange(pos,pos);}catch(_){} } }; };
  bind('co_customer','customer'); bind('co_discRef','discRef'); bind('co_payRef','payRef');
  bind('co_discAmt','discAmt',true); bind('co_tendered','tendered',true);
}
async function charge(btn){
  const t = cartTotals(); const co = S.co;
  if (co.discType==='senior_pwd' && !co.discRef.trim()) return toast('Enter the Senior Citizen / PWD ID number.', true);
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const sale = await q(sb.rpc('create_sale', {
      p_items: S.cart.map(l => ({ variant_id:l.variant_id, qty:l.qty })),
      p_order_type: co.orderType, p_customer: co.customer, p_discount_type: co.discType, p_discount_ref: co.discRef,
      p_discount: Number(co.discAmt)||0, p_payment_method: co.method, p_payment_ref: co.payRef,
      p_tendered: co.method==='Cash' ? Number(co.tendered) : null, p_note: null }));
    const lines = S.cart.map(l => ({ product_name:l.name, variant_label:l.label, qty:l.qty, unit_price:l.price, line_total:round2(l.qty*l.price) }));
    S.cart = []; S.co = { orderType:co.orderType, customer:'', discType:'none', discRef:'', discAmt:'', method:'Cash', payRef:'', tendered:'' }; S.cartOpen = false;
    refreshStock().then(() => S.view==='sell' && renderProducts()).catch(()=>{});
    if (S.view==='sell'){ document.getElementById('cart')?.classList.remove('open'); renderProducts(); renderCart(); }
    showReceipt(sale, lines, true);
  } catch(e){ toast(errMsg(e), true); btn.disabled = false; renderCart(); }
}
function receiptHTML(s, lines){
  const discLbl = s.discount_type==='senior_pwd' ? `Senior/PWD 20% (ID ${esc(s.discount_ref||'')})` : 'Promo discount';
  return `<div class="receipt">
    <div class="c"><div class="t">${STORE.name}</div><div>${STORE.tagline}</div><div>${STORE.phone}</div></div><hr>
    <div class="l"><span>${esc(s.sale_no)}</span><span>${esc(s.order_type)}</span></div>
    <div>${fmtDT(s.created_at)}</div><div>Cashier: ${esc(nameOf(s.cashier_id))}</div>
    ${s.customer ? `<div>Customer: ${esc(s.customer)}</div>` : ''}<hr>
    ${lines.map(l => `<div>${esc(l.product_name)}${l.variant_label?' ('+esc(l.variant_label)+')':''}</div>
      <div class="l"><span>&nbsp;&nbsp;${l.qty} x ${Number(l.unit_price).toFixed(2)}</span><span>${Number(l.line_total).toFixed(2)}</span></div>`).join('')}
    <hr><div class="l"><span>Subtotal</span><span>${Number(s.subtotal).toFixed(2)}</span></div>
    ${Number(s.discount) ? `<div class="l"><span>${discLbl}</span><span>-${Number(s.discount).toFixed(2)}</span></div>` : ''}
    <div class="l big"><span>TOTAL</span><span>₱${Number(s.total).toFixed(2)}</span></div>
    <div class="l"><span>${esc(s.payment_method)}${s.payment_ref?' #'+esc(s.payment_ref):''}</span><span>${Number(s.amount_tendered??s.total).toFixed(2)}</span></div>
    ${s.payment_method==='Cash' ? `<div class="l"><span>Change</span><span>${Number(s.change_due).toFixed(2)}</span></div>` : ''}
    ${s.status==='void' ? `<hr><div class="c big">*** VOID ***</div><div class="c">${esc(s.void_reason||'')}</div>` : ''}

function stockModal(id){
  const it = itemById(Number(id));
  openModal(`<div class="modal-h"><h2>${esc(it.name)}</h2><span class="pill ${stockStatus(it)[1]} num">${qtyFmt(it.qty)} ${esc(it.unit)}</span></div>

async function saveStock(id, btn){
  const it = itemById(Number(id)); const t = document.querySelector('.overlay').dataset.st;
  const raw = document.getElementById('st_qty').value; const v = Number(raw);
  if (raw === '' || v < 0 || (t !== 'adjust' && v === 0)) return toast('Enter a quantity.', true);
  const change = t==='restock' ? v : t==='waste' ? -v : round2(v - Number(it.qty));
  if (change === 0) return toast('The count matches what is on hand. Nothing to change.');
  btn.disabled = true;
  try { await q(sb.rpc('adjust_stock', { p_item_id:it.id, p_change:change, p_type:t, p_note:document.getElementById('st_note').value }));
    closeModal(); toast('Stock updated.'); await refreshStock(); renderStock();
  } catch(e){ btn.disabled = false; toast(errMsg(e), true); }
}

async function saveItem(id, btn){

async function saveProd(id, btn){
  syncDraft();
  const name = document.getElementById('p_name').value.trim(); const category = document.getElementById('p_cat').value; const active = document.getElementById('p_active').checked;
  if (!name) return toast('Enter the item name.', true);
  const vs = S.draft.variants;
  if (vs.some(v => v.price === '' || Number(v.price) < 0)) return toast('Every option needs a price.', true);
  if (vs.length > 1 && vs.some(v => !v.label.trim())) return toast('Give each size or option a label.', true);
  btn.disabled = true;
  try {
    let pid = id ? Number(id) : null;
    if (pid) await q(sb.from('products').update({ name, category, active }).eq('id', pid));
    else { const sort = S.products.filter(p => p.category===category).length + 1; pid = (await q(sb.from('products').insert({ name, category, active, sort }).select().single())).id; }
    const keep = vs.filter(v => v.id).map(v => v.id);
    const removed = variantsOf(pid).filter(v => !keep.includes(v.id)).map(v => v.id);
    if (removed.length) await q(sb.from('variants').delete().in('id', removed));
    for (const [i,v] of vs.entries()){
      const row = { product_id:pid, label:v.label.trim(), price:Number(v.price), active:v.active, sort:i+1 };
      let vid = v.id;
      if (vid) await q(sb.from('variants').update(row).eq('id', vid));
      else vid = (await q(sb.from('variants').insert(row).select().single())).id;
      await q(sb.from('recipes').delete().eq('variant_id', vid));
      const rec = []; v.recipe.forEach(r => { if (Number(r.qty) > 0 && !rec.some(x => x.item_id===r.item_id)) rec.push({ variant_id:vid, item_id:r.item_id, qty:Number(r.qty) }); });
      if (rec.length) await q(sb.from('recipes').insert(rec));
    }
    await loadCatalog(); closeModal(); toast('Menu saved.'); viewMenu();
  } catch(e){ btn.disabled = false; toast(errMsg(e), true); }
}

/* ===================== REPORTS (admin) ===================== */
function rangeDates(){
  const t = manilaDate(); const r = S.rep;
  if (r.range==='today') return [t,t];
  if (r.range==='yesterday') { const y = addDays(t,-1); return [y,y]; }
  if (r.range==='7d') return [addDays(t,-6), t];
  if (r.range==='month') return [t.slice(0,8)+'01', t];
  return [r.from || t, r.to || t];
}
function viewReports(){
  const r = S.rep; const [f,t] = rangeDates();
  main().innerHTML = `<div class="page">
    <div class="page-head"><div><h1>Reports</h1><div class="sub" id="rp_sub">${f===t ? fmtDay(f) : fmtDay(f)+' – '+fmtDay(t)}</div></div><span class="spacer"></span>
      <button class="btn" data-act="csv">Export CSV</button></div>
    <div class="rangebar">${[['today','Today'],['yesterday','Yesterday'],['7d','Last 7 days'],['month','This month'],['custom','Custom']].map(([k,l]) => `<button class="chip ${r.range===k?'on':''}" data-act="range" data-v="${k}">${l}</button>`).join('')}
      ${r.range==='custom' ? `<input class="input" type="date" id="rp_from" value="${f}" style="max-width:160px"><span class="muted">to</span><input class="input" type="date" id="rp_to" value="${t}" style="max-width:160px">` : ''}</div>
    <div id="rp"><div class="empty">Crunching the numbers…</div></div>
  </div>`;
  if (r.range==='custom'){ const h = () => { S.rep.from = document.getElementById('rp_from').value; S.rep.to = document.getElementById('rp_to').value; if (S.rep.from && S.rep.to) viewReports(); };
    document.getElementById('rp_from').onchange = h; document.getElementById('rp_to').onchange = h; }
  loadReport();
}
async function loadReport(){
  let [f,t] = rangeDates(); if (f > t) [f,t] = [t,f];
  try {
    const sales = await q(sb.from('sales').select('*, sale_items(*)').gte('created_at', dayStart(f).toISOString()).lt('created_at', dayStart(addDays(t,1)).toISOString()).order('created_at').limit(5000));
    S.repData = { f, t, sales }; await refreshStock(); renderReport();
  } catch(e){ document.getElementById('rp').innerHTML = `<div class="empty">Could not load the report: ${esc(errMsg(e))}</div>`; }
}
function sumBy(arr, keyFn, valFn){ const m = new Map(); arr.forEach(x => { const k = keyFn(x); m.set(k, (m.get(k)||0) + valFn(x)); }); return m; }
function barList(map, opt={}){
  const rows = [...map.entries()].sort((a,b) => b[1]-a[1]); const max = Math.max(...rows.map(r=>r[1]), 1);
  if (!rows.length) return '<div class="muted">No data.</div>';
  return `<div class="bars">${rows.map(([k,v]) => `<div class="bar-row"><span>${esc(k)}</span><div class="track"><div class="fill ${opt.ink?'ink':''}" style="width:${(v/max*100).toFixed(1)}%"></div></div><b class="num">${opt.count?qtyFmt(v):peso(v,0)}</b></div>`).join('')}</div>`;
}
function columnChart(labels, values, sub){
  const W = 640, H = 220, padL = 46, padB = 26, padT = 12, n = labels.length; const max = Math.max(...values, 1);
  const nice = (() => { const p = Math.pow(10, Math.floor(Math.log10(max))); const s = [1,2,2.5,5,10].find(x => x*p >= max); return s*p; })();
  const bw = (W - padL - 8) / n; const y = v => padT + (H - padT - padB) * (1 - v/nice);
  let g = '';
  for (let i=0;i<=4;i++){ const v = nice*i/4; g += `<line x1="${padL}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${padL-6}" y="${y(v)+4}" text-anchor="end">${v>=1000?(v/1000)+'k':v}</text>`; }
  const step = Math.ceil(n/12);
  values.forEach((v,i) => { const x = padL + i*bw + bw*.15, w = bw*.7;
    g += `<rect x="${x}" y="${y(v)}" width="${w}" height="${Math.max(0,H-padB-y(v))}" rx="2" fill="${v===Math.max(...values)&&v>0?'var(--accent)':'var(--ink)'}"><title>${labels[i]}: ${peso(v)}</title></rect>`;
    if (i % step === 0) g += `<text x="${x+w/2}" y="${H-8}" text-anchor="middle">${labels[i]}</text>`; });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(sub)}">${g}</svg></div>`;
}
function renderReport(){
  const { f, t, sales } = S.repData;
  const ok = sales.filter(s => s.status==='completed'); const voids = sales.filter(s => s.status==='void');
  const net = ok.reduce((a,s)=>a+Number(s.total),0), gross = ok.reduce((a,s)=>a+Number(s.subtotal),0), disc = ok.reduce((a,s)=>a+Number(s.discount),0);
  const lines = ok.flatMap(s => s.sale_items);
  const itemsSold = lines.reduce((a,l)=>a+l.qty,0);
  // trend
  let chart, chartTitle;
  if (f === t){
    const hrs = ok.map(s => hourOf(s.created_at)); const lo = Math.min(9, ...hrs), hi = Math.max(21, ...hrs);
    const labels = [], vals = [];
    for (let h=lo; h<=hi; h++){ labels.push((h%12||12)+(h<12?'a':'p')); vals.push(ok.filter(s => hourOf(s.created_at)===h).reduce((a,s)=>a+Number(s.total),0)); }
    chart = columnChart(labels, vals, 'Sales by hour'); chartTitle = 'Sales by hour';
  } else {
    const labels = [], vals = []; let d = f, guard = 0;
    while (d <= t && guard++ < 400){ labels.push(dayStart(d).toLocaleDateString('en-PH',{timeZone:TZ,month:'short',day:'numeric'})); vals.push(ok.filter(s => manilaDate(new Date(s.created_at))===d).reduce((a,s)=>a+Number(s.total),0)); d = addDays(d,1); }
    chart = columnChart(labels, vals, 'Sales by day'); chartTitle = 'Sales by day';
  }
  const items = new Map(); lines.forEach(l => { const k = l.product_name + (l.variant_label ? ' · ' + l.variant_label : ''); const o = items.get(k) || { q:0, r:0, c:l.category }; o.q += l.qty; o.r += Number(l.line_total); items.set(k, o); });
  const top = [...items.entries()].sort((a,b) => b[1].r - a[1].r);
  const cashiers = new Map(); ok.forEach(s => { const o = cashiers.get(s.cashier_id) || { n:0, v:0 }; o.n++; o.v += Number(s.total); cashiers.set(s.cashier_id, o); });
  const low = S.items.filter(i => i.active && stockStatus(i)[0] !== 'OK');
  const senior = ok.filter(s => s.discount_type==='senior_pwd');
  document.getElementById('rp').innerHTML = `
    <div class="kpis">
      <div class="kpi hero"><span class="k">Net sales</span><span class="v num">${peso(net)}</span><span class="s num">Gross ${peso(gross)}</span></div>
      <div class="kpi"><span class="k">Orders</span><span class="v num">${ok.length}</span><span class="s num">${itemsSold} items sold</span></div>
      <div class="kpi"><span class="k">Average order</span><span class="v num">${peso(ok.length?net/ok.length:0)}</span></div>
      <div class="kpi"><span class="k">Discounts</span><span class="v num">${peso(disc)}</span><span class="s num">${senior.length} Senior/PWD</span></div>
      <div class="kpi"><span class="k">Voids</span><span class="v num">${voids.length}</span><span class="s num">${peso(voids.reduce((a,s)=>a+Number(s.total),0))}</span></div>
    </div>
    <div class="two">
      <div class="card"><div class="card-h"><h3>${chartTitle}</h3><span class="spacer"></span><span class="muted" style="font-size:13px">Highest in saffron</span></div><div class="card-b">${ok.length ? chart : '<div class="empty">No sales in this period yet.</div>'}</div></div>
      <div class="card"><div class="card-h"><h3>Payment methods</h3></div><div class="card-b">${barList(sumBy(ok, s=>s.payment_method, s=>Number(s.total)))}
        <div class="lbl" style="margin:16px 0 8px">Order type</div>${barList(sumBy(ok, s=>s.order_type, s=>Number(s.total)), {ink:true})}
        <div class="lbl" style="margin:16px 0 8px">Category</div>${barList(sumBy(lines, l=>l.category, l=>Number(l.line_total)))}</div></div>
    </div>
    <div class="two">
      <div class="card"><div class="card-h"><h3>Best sellers</h3><span class="muted" style="font-size:13px">by revenue</span></div>
        ${top.length ? `<div class="tbl-wrap"><table><thead><tr><th>#</th><th>Item</th><th class="r">Qty</th><th class="r">Revenue</th><th class="r">Share</th></tr></thead><tbody>
        ${top.slice(0,12).map(([k,o],i) => `<tr><td class="num muted">${i+1}</td><td><b>${esc(k)}</b><div class="muted" style="font-size:12px">${esc(o.c)}</div></td><td class="r num">${o.q}</td><td class="r num">${peso(o.r)}</td><td class="r num">${gross?(o.r/gross*100).toFixed(1):0}%</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">No items sold yet.</div>'}</div>
      <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
        <div class="card"><div class="card-h"><h3>Sales officers</h3></div>
          ${cashiers.size ? `<div class="tbl-wrap"><table><thead><tr><th>Name</th><th class="r">Orders</th><th class="r">Sales</th></tr></thead><tbody>${[...cashiers.entries()].sort((a,b)=>b[1].v-a[1].v).map(([id,o]) => `<tr><td>${esc(nameOf(id))}</td><td class="r num">${o.n}</td><td class="r num">${peso(o.v)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">No sales yet.</div>'}</div>
        <div class="card"><div class="card-h"><h3>Stock to reorder</h3><span class="spacer"></span><a class="btn sm ghost" href="#inventory">Open inventory</a></div>
          ${low.length ? `<div class="tbl-wrap"><table><tbody>${low.map(i => `<tr><td>${esc(i.name)}</td><td class="r num">${qtyFmt(i.qty)} ${esc(i.unit)}</td><td class="r"><span class="pill ${stockStatus(i)[1]}">${stockStatus(i)[0]}</span></td></tr>`).join('')}</tbody></table></div>` : '<div class="card-b muted">Everything is above its reorder level.</div>'}</div>
      </div>
    </div>`;
}
function exportCSV(){
  if (!S.repData) return;
  const rows = [['Sale No','Date','Time','Cashier','Order Type','Customer','Item','Option','Qty','Unit Price','Line Total','Sale Subtotal','Discount Type','Discount','Sale Total','Payment','Status']];
  S.repData.sales.forEach(s => s.sale_items.forEach(l => rows.push([s.sale_no, manilaDate(new Date(s.created_at)), fmtTime(s.created_at), nameOf(s.cashier_id), s.order_type, s.customer||'', l.product_name, l.variant_label, l.qty, l.unit_price, l.line_total, s.subtotal, s.discount_type, s.discount, s.total, s.payment_method, s.status])));
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿'+csv], { type:'text/csv' }));
  a.download = `indiana-spice-sales_${S.repData.f}_to_${S.repData.t}.csv`; document.body.appendChild(a); a.click(); a.remove();
}

  S.profiles = await q(sb.from('profiles').select('*').order('full_name')).catch(() => S.profiles);
  main().innerHTML = `<div class="page">
    <div class="page-head"><div><h1>Staff accounts</h1><div class="sub">Sales Officers can sell, view their own sales and check stock. Admins see everything.</div></div>
      <span class="spacer"></span><button class="btn primary" data-act="newstaff">Add staff</button></div>
    <div class="card"><div class="tbl-wrap"><table><thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody>
    ${S.profiles.map(p => { const self = p.id === S.me.id; return `<tr><td><b>${esc(p.full_name)}</b>${self?' <span class="muted">(you)</span>':''}</td><td class="num">@${esc(p.username)}</td>
      <td>${self ? '<span class="pill mute">Admin</span>' : `<select class="input" data-act-change="role" data-id="${p.id}" style="max-width:160px;min-height:34px;padding:4px 8px"><option value="sales" ${p.role==='sales'?'selected':''}>Sales Officer</option><option value="admin" ${p.role==='admin'?'selected':''}>Admin</option></select>`}</td>
      <td>${p.active?'<span class="pill good">Active</span>':'<span class="pill bad">Deactivated</span>'}</td>
      <td class="r" style="white-space:nowrap"><button class="btn sm" data-act="resetpw" data-id="${p.id}">Reset password</button>${self?'':` <button class="btn sm ${p.active?'danger':''}" data-act="toggleactive" data-id="${p.id}">${p.active?'Deactivate':'Activate'}</button>`}</td></tr>`; }).join('')}
    </tbody></table></div></div>
    <div class="muted" style="font-size:13px">Staff sign in with their username and password on any phone, tablet or computer.</div>
  </div>`;
  main().querySelectorAll('[data-act-change="role"]').forEach(s => s.onchange = async e => {
    try { await q(sb.from('profiles').update({ role:e.target.value }).eq('id', e.target.dataset.id)); toast('Role updated.'); viewStaff(); } catch(err){ toast(errMsg(err), true); } });
}
function staffModal(){
  openModal(`<div class="modal-h"><h2>Add staff</h2></div><div class="modal-b">
    <div class="field"><label for="sf_name">Full name</label><input class="input" id="sf_name" placeholder="e.g. Maria Santos"></div>
    <div class="grid2"><div class="field"><label for="sf_user">Username</label><input class="input" id="sf_user" autocapitalize="none" placeholder="e.g. maria"></div>
      <div class="field"><label for="sf_role">Role</label><select class="input" id="sf_role"><option value="sales">Sales Officer</option><option value="admin">Admin</option></select></div></div>
    <div class="field"><label for="sf_pass">Starting password</label><input class="input" id="sf_pass" type="text" placeholder="At least 6 characters"></div>
    <div class="muted" style="font-size:13px">Share the username and password with them. You can reset it any time.</div>
  </div><div class="modal-f"><button class="btn ghost" data-act="close">Cancel</button><button class="btn primary" data-act="savestaff">Create account</button></div>`);
}
async function saveStaff(btn){
  btn.disabled = true;
  try { await callStaff({ action:'create', full_name:document.getElementById('sf_name').value, username:document.getElementById('sf_user').value, password:document.getElementById('sf_pass').value, role:document.getElementById('sf_role').value });
    closeModal(); toast('Staff account created.'); viewStaff();
  } catch(e){ btn.disabled = false; toast(errMsg(e), true); }
}
function resetPwModal(id){
  const p = S.profiles.find(x => x.id === id);
  openModal(`<div class="modal-h"><h2>Reset password</h2></div><div class="modal-b"><div>New password for <b>${esc(p.full_name)}</b> (@${esc(p.username)})</div>
    <input class="input" id="rp_pw" type="text" placeholder="At least 6 characters"></div>
    <div class="modal-f"><button class="btn ghost" data-act="close">Cancel</button><button class="btn primary" data-act="dopw" data-id="${id}">Set password</button></div>`);
}

    <div class="card card-b" style="display:flex;flex-direction:column;gap:2px"><span class="lbl">${isAdmin()?'Admin':'Sales Officer'}</span><b style="font-size:18px">${esc(S.me.full_name)}</b><span class="muted">@${esc(S.me.username)}</span></div>
    ${isAdmin() ? `<div class="card"><div class="list-m" style="display:flex">${['menu','staff'].map(v => `<a class="li" href="#${v}" style="text-decoration:none;color:inherit"><span class="a">${VIEWS[v].label}</span><span class="c">›</span><span class="b">${v==='menu'?'Prices, sizes and stock links':'Accounts for sales officers'}</span></a>`).join('')}</div></div>` : ''}
    <button class="btn danger" data-act="signout">Sign out</button>

/* ===================== modal ===================== */
function openModal(html, wide){
  closeModal();
  const o = document.createElement('div'); o.className = 'overlay';
  o.innerHTML = `<div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true">${html}</div>`;
  o.addEventListener('mousedown', e => { if (e.target === o) closeModal(); });
  document.body.appendChild(o);
  setTimeout(() => o.querySelector('input:not([type=checkbox]),select')?.focus(), 30);
}
function closeModal(){ document.querySelectorAll('.overlay').forEach(o => o.remove()); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ===================== events ===================== */
document.addEventListener('click', async e => {
  const nav = e.target.closest('button[data-nav]');
  if (nav){ location.hash = nav.dataset.nav; return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  switch (a){
    case 'signout': return signOut();
    case 'cat': S.cat = el.dataset.v; document.querySelectorAll('[data-act=cat]').forEach(c => c.classList.toggle('on', c.dataset.v === S.cat)); return renderProducts();
    case 'pick': {
      const vs = variantsOf(Number(el.dataset.pid)).filter(v => v.active);
      if (vs.length === 1) return addToCart(vs[0].id);
      const p = S.products.find(x => x.id == el.dataset.pid);
      return openModal(`<div class="modal-h"><h2>${esc(p.name)}</h2></div><div class="modal-b"><div class="variant-pick">${vs.map(v => { const l = servingsLeft(v.id);
        return `<button data-act="pickv" data-v="${v.id}"><span>${esc(v.label)}</span><b class="num">${pesoShort(v.price)}</b>${l!==null?`<span class="pill ${l<=0?'bad':l<=5?'warn':'mute'}">${l<=0?'Out':l+' left'}</span>`:''}</button>`; }).join('')}</div></div>`);
    }
    case 'pickv': closeModal(); return addToCart(Number(el.dataset.v));
    case 'inc': S.cart[el.dataset.i].qty++; renderProducts(); return renderCart();
    case 'dec': { const l = S.cart[el.dataset.i]; if (--l.qty <= 0) S.cart.splice(el.dataset.i,1); renderProducts(); return renderCart(); }
    case 'rm': S.cart.splice(el.dataset.i,1); renderProducts(); return renderCart();
    case 'clearcart': S.cart = []; renderProducts(); return renderCart();
    case 'co': S.co[el.dataset.k] = el.dataset.v; return renderCart();
    case 'cash': S.co.tendered = el.dataset.v; return renderCart();
    case 'opencart': S.cartOpen = true; return document.getElementById('cart').classList.add('open');
    case 'closecart': S.cartOpen = false; return document.getElementById('cart').classList.remove('open');
    case 'charge': return charge(el);
    case 'print': return window.print();
    case 'close': return closeModal();
    case 'sday': S.salesDate = addDays(S.salesDate, Number(el.dataset.d)); document.getElementById('sl_date').value = S.salesDate; return loadSales();
    case 'opensale': return openSale(id);
    case 'askvoid': document.getElementById('voidBox').hidden = false; el.hidden = true; return document.getElementById('v_reason').focus();
    case 'cancelvoid': document.getElementById('voidBox').hidden = true; document.querySelector('[data-act=askvoid]').hidden = false; return;
    case 'dovoid': return doVoid(id, el);
    case 'invtab': S.invTab = el.dataset.v; return viewInventory();
    case 'stock': return stockModal(id);
    case 'sttype': { const o = document.querySelector('.overlay'); o.dataset.st = el.dataset.v; document.querySelectorAll('[data-act=sttype]').forEach(b => b.classList.toggle('on', b===el));
      const it = document.querySelector('[data-act=savestock]'); const unit = itemById(Number(it.dataset.id)).unit;
      document.getElementById('st_lbl').textContent = { restock:`Quantity added (${unit})`, waste:`Quantity wasted (${unit})`, adjust:`Actual count on hand (${unit})` }[el.dataset.v];
      o.prevStock && o.prevStock(); return; }
    case 'savestock': return saveStock(id, el);
    case 'newitem': return itemModal(null);
    case 'edititem': return itemModal(id);
    case 'saveitem': return saveItem(id, el);
    case 'editprod': return prodModal(id || null);
    case 'addvar': syncDraft(); S.draft.variants.push({ label:'', price:'', active:true, recipe:[] }); return renderVariants();
    case 'rmvar': syncDraft(); S.draft.variants.splice(el.dataset.vi,1); return renderVariants();
    case 'addrec': syncDraft(); if (!S.items.length) return toast('Add a stock item first in Inventory.', true); S.draft.variants[el.dataset.vi].recipe.push({ item_id:S.items[0].id, qty:1 }); return renderVariants();
    case 'rmrec': { syncDraft(); const [vi,ri] = el.dataset.ri.split('.'); S.draft.variants[vi].recipe.splice(ri,1); return renderVariants(); }
    case 'saveprod': return saveProd(id, el);
    case 'range': S.rep.range = el.dataset.v; return viewReports();
    case 'csv': return exportCSV();
    case 'newstaff': return staffModal();
    case 'savestaff': return saveStaff(el);
    case 'resetpw': return resetPwModal(id);
    case 'dopw': el.disabled = true; try { await callStaff({ action:'set_password', id, password:document.getElementById('rp_pw').value }); closeModal(); toast('Password updated.'); } catch(err){ el.disabled = false; toast(errMsg(err), true); } return;
    case 'toggleactive': { const p = S.profiles.find(x => x.id === id); el.disabled = true;
      try { await callStaff({ action:'set_active', id, active:!p.active }); toast(p.active ? 'Account deactivated.' : 'Account activated.'); viewStaff(); } catch(err){ el.disabled = false; toast(errMsg(err), true); } return; }
  }
});

sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT' && S.me){ S.me = null; showAuth(); } });
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
