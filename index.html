<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Indiana Spice POS</title>
<meta name="theme-color" content="#0e0e0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Indiana POS">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@600;700&family=Hind:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* Layout: sidebar + work area on desktop, top bar + bottom tabs on phones. Black menu-board ink, saffron for money and actions. */
:root{
  --bg:#f4f3f0; --surface:#ffffff; --surface-2:#faf9f6; --ink:#17130f; --muted:#6c655c; --line:#e3dfd7;
  --accent:#f2b705; --accent-ink:#1d1600; --accent-soft:#fdf3cf;
  --chili:#c2361b; --chili-soft:#fbe7e2; --good:#2c7a4b; --good-soft:#e2f2e8; --warn:#9a6a08; --warn-soft:#fbf0d6;
  --side:#17130f; --side-ink:#f3efe8; --side-muted:#a39b90;
  --f-display:"Cormorant Garamond", "Cormorant", Georgia, "Times New Roman", serif;
  --f-body:"Hind", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:10px; --tab-h:62px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121110; --surface:#1c1a17; --surface-2:#232019; --ink:#f3efe8; --muted:#a39b90; --line:#332f29;
  --accent:#f5c22b; --accent-ink:#1d1600; --accent-soft:#3a3013;
  --chili:#e86a4c; --chili-soft:#3b1f18; --good:#5bb784; --good-soft:#18301f; --warn:#e0a93a; --warn-soft:#352a12;
  --side:#0b0a09; --side-ink:#f3efe8; --side-muted:#8f877c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121110; --surface:#1c1a17; --surface-2:#232019; --ink:#f3efe8; --muted:#a39b90; --line:#332f29;
  --accent:#f5c22b; --accent-ink:#1d1600; --accent-soft:#3a3013;
  --chili:#e86a4c; --chili-soft:#3b1f18; --good:#5bb784; --good-soft:#18301f; --warn:#e0a93a; --warn-soft:#352a12;
  --side:#0b0a09; --side-ink:#f3efe8; --side-muted:#8f877c; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- buttons & fields ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);
  border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:40px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
a.btn{text-decoration:none;color:inherit}
#rp{display:flex;flex-direction:column;gap:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(.96)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.danger{color:var(--chili);border-color:var(--chili)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;min-height:40px}
.input:focus{border-color:var(--ink);outline:none}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:6px;padding:7px 8px;font-weight:600;cursor:pointer;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--chili-soft);color:var(--chili)}
.pill.mute{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* ---------- auth ---------- */
.auth{min-height:100%;display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--side);color:var(--side-ink)}
.auth-card{width:100%;max-width:380px;background:var(--surface);color:var(--ink);border-radius:14px;padding:28px 24px;display:flex;flex-direction:column;gap:14px}
.brand{font-family:var(--f-display);font-size:30px;line-height:1;letter-spacing:.01em}
.brand small{display:block;font-family:var(--f-body);font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;margin-top:6px;opacity:.7}
.auth-head{text-align:center;padding-bottom:6px;border-bottom:1px dashed var(--line)}
.err{background:var(--chili-soft);color:var(--chili);padding:8px 11px;border-radius:8px;font-size:14px}
.note{background:var(--accent-soft);padding:8px 11px;border-radius:8px;font-size:14px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:220px 1fr;height:100%}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:20px 12px;gap:4px;overflow:auto}
.side .brand{padding:0 10px 18px;font-size:26px}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;color:var(--side-muted);text-decoration:none;font-weight:600;border:0;background:none;cursor:pointer;text-align:left;width:100%}
.nav svg{width:20px;height:20px;flex:none}
.nav:hover{color:var(--side-ink);background:rgba(255,255,255,.06)}
.nav.on{color:var(--accent-ink);background:var(--accent)}
.branchbox{margin:6px 4px 14px;display:flex;flex-direction:column;gap:4px}
.branchbox .lbl{color:var(--side-muted)}
.branchsel{width:100%;background:rgba(255,255,255,.08);color:var(--side-ink);border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:8px 10px;font-weight:600}
.branchsel option{color:#111}
.branchfix{color:var(--accent);font-weight:700;padding:2px 0}
.topbar .branchsel{width:auto;max-width:150px;padding:5px 8px;font-size:13px}
.pickbranch{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.pickbranch button{text-align:left;padding:18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;gap:2px}
.pickbranch button:hover{border-color:var(--ink)}
.pickbranch b{font-size:17px}
.matrix td.q{text-align:right;white-space:nowrap}
.whoami{margin-top:auto;padding:12px;border-top:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;gap:2px;font-size:14px}
.whoami .r{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.whoami button{margin-top:8px;align-self:flex-start;background:none;border:1px solid rgba(255,255,255,.2);color:var(--side-ink);border-radius:7px;padding:5px 10px;cursor:pointer;font-size:13px}
main{min-width:0;overflow:auto;position:relative}
.topbar,.tabbar{display:none}
.page{padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.page-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.page-head h1{font-family:var(--f-display);font-size:30px;line-height:1.05;font-weight:400}
.page-head .sub{color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.card-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:15px;font-weight:700}
.card-b{padding:14px 16px}

@media (max-width:860px){
  .shell{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .side{display:none}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--side)}
  .topbar{display:flex;align-items:center;gap:10px;background:var(--side);color:var(--side-ink);padding-block:10px;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
  .topbar .brand{font-size:21px}
  .topbar .who{margin-left:auto;font-size:13px;color:var(--side-muted);text-align:right;line-height:1.2}
  .topbar .who b{color:var(--side-ink);display:block}
  main{padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px))}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabbar button{flex:1;height:var(--tab-h);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer}
  .tabbar svg{width:22px;height:22px}
  .tabbar button.on{color:var(--ink)}
  .tabbar button.on svg{color:var(--warn)}
  .page{padding-block:16px 28px}
  .page-head h1{font-size:25px}
}

/* ---------- sell ---------- */
.sell{display:grid;grid-template-columns:1fr 380px;height:100%;min-height:0}
.catalog{min-width:0;overflow:auto;padding-block:18px 30px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:14px}
.catbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.catbar .input{max-width:260px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-weight:600;cursor:pointer;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cat-title{font-family:var(--f-display);font-size:21px;font-weight:400;display:flex;align-items:center;gap:10px;margin-top:4px}
.cat-title::after{content:"";flex:1;border-top:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.prod{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;
  display:flex;flex-direction:column;gap:6px;min-height:104px;transition:border-color .12s, transform .08s}
.prod:hover{border-color:var(--ink)}
.prod:active{transform:scale(.98)}
.prod .nm{font-weight:700;line-height:1.2;font-size:15px}
.prod .pr{margin-top:auto;font-weight:700;font-size:16px}
.prod .pr span{color:var(--muted);font-weight:500;font-size:13px}
.prod .tag{align-self:flex-start}
.prod.has-ph{padding-top:0;overflow:hidden}
.prod .ph{display:block;margin:0 -12px 2px;width:calc(100% + 24px);max-width:none;aspect-ratio:4/3;object-fit:cover;background:var(--surface-2);border-bottom:1px solid var(--line)}
.thumb{width:40px;height:40px;border-radius:7px;object-fit:cover;flex:none;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.thumb svg{width:18px;height:18px}
.namecell{display:flex;align-items:center;gap:10px;min-width:0}
.photo-pick{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.photo-pick .pv{width:96px;height:96px;border-radius:10px;object-fit:cover;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;overflow:hidden}
.photo-pick .pv img{width:100%;height:100%;object-fit:cover}
.photo-pick label.btn{text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink)}
.photo-pick input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.prod .incart{position:absolute;bottom:10px;right:10px;background:var(--accent);color:var(--accent-ink);border-radius:99px;min-width:24px;height:24px;display:grid;place-items:center;font-weight:700;font-size:13px;padding:0 6px}
.cart{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.cart-h{padding:16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.cart-h h2{font-family:var(--f-display);font-weight:400;font-size:22px}
.cart-lines{flex:1;overflow:auto;padding:4px 16px}
.cline{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.cline .n{font-weight:600;line-height:1.25}
.cline .v{font-size:13px;color:var(--muted)}
.cline .t{font-weight:700;text-align:right}
.stepper{justify-self:start;display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stepper button{width:32px;height:30px;border:0;background:var(--surface-2);cursor:pointer;font-size:17px;font-weight:700}
.stepper span{min-width:30px;text-align:center;font-weight:700}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:14px}
.checkout{border-top:1px solid var(--line);padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2);overflow:auto;max-height:62%}
.totals{display:flex;flex-direction:column;gap:3px;font-size:14px}
.totals div{display:flex;justify-content:space-between}
.totals .grand{font-size:22px;font-weight:700;padding-top:6px;border-top:1px solid var(--line);margin-top:4px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{flex:1;min-width:56px}
.change{display:flex;justify-content:space-between;font-weight:700;font-size:15px;padding:8px 10px;border-radius:8px;background:var(--good-soft);color:var(--good)}
.change.short{background:var(--chili-soft);color:var(--chili)}
.charge{min-height:52px;font-size:18px}
.cart-pay{padding:10px 16px 14px;border-top:1px solid var(--line);background:var(--surface-2)}
.cart-pay .charge{width:100%}
.cartfab{display:none}
.cart-close{display:none}
@media (max-width:1060px){.sell{grid-template-columns:1fr 340px}}
@media (max-width:860px){
  .sell{display:block;height:auto}
  .catalog{padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:90px;overflow:visible}
  .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .catbar .input{max-width:none;flex:1 1 100%}
  .cart{position:fixed;inset:0;z-index:40;border:0;transform:translateY(100%);transition:transform .22s ease;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .cart.open{transform:none}
  .cart-close{display:inline-flex}
  .checkout{max-height:none;flex:none}
  .cart-lines{min-height:80px}
  .cart.open .cart-scroll{overflow:auto}
  .cartfab{display:flex;position:fixed;z-index:24;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));
    bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 10px);background:var(--ink);color:var(--bg);border:0;border-radius:12px;padding:14px 16px;font-weight:700;font-size:16px;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);cursor:pointer}
  .cartfab .amt{margin-left:auto;color:var(--accent)}
}
.cart-scroll{display:flex;flex-direction:column;flex:1;min-height:0}
@media (max-width:860px){.cart-scroll{overflow:auto}}

/* ---------- tables & lists ---------- */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
.void-row td{color:var(--muted);text-decoration:line-through}
.void-row td.keep{text-decoration:none}
.list-m{display:none}
@media (max-width:700px){
  .tbl-wrap.resp{display:none}
  .list-m{display:flex;flex-direction:column}
  .li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%}
  .li:last-child{border-bottom:0}
  .li .a{font-weight:700}
  .li .b{font-size:13px;color:var(--muted)}
  .li .c{text-align:right;font-weight:700}
}

/* ---------- KPIs & charts ---------- */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font-size:23px;font-weight:700;line-height:1.15}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.hero{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kpi.hero .k,.kpi.hero .s{color:inherit;opacity:.7}
.kpi.hero .v{color:var(--accent)}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi.hero{grid-column:1/-1}}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:1000px){.two,.three{grid-template-columns:1fr}}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font:11px var(--f-body)}
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;font-size:14px}
.bar-row .track{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar-row .fill{height:100%;background:var(--accent)}
.bar-row .fill.ink{background:var(--ink)}
.rangebar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- modal & toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,8,6,.55);z-index:60;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:520px;max-height:calc(100% - 20px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal.wide{max-width:760px}
.modal-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-h h2{font-family:var(--f-display);font-weight:400;font-size:22px}
.modal-b{padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:600px){.overlay{place-items:end stretch;padding:0}.modal{max-width:none;border-radius:16px 16px 0 0;max-height:92%;padding-bottom:env(safe-area-inset-bottom,0px)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.toast.bad{background:var(--chili);color:#fff}
@media (max-width:860px){.toast{bottom:calc(var(--tab-h) + 80px + env(safe-area-inset-bottom,0px))}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
.variant-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.variant-pick button{padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.variant-pick button:hover{border-color:var(--ink)}
.variant-pick b{font-size:18px}
.vblock{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.vgrid{display:grid;grid-template-columns:1fr 110px auto auto;gap:8px;align-items:end}
.rgrid{display:grid;grid-template-columns:1fr 90px auto;gap:6px;align-items:center}
@media (max-width:480px){.vgrid{grid-template-columns:1fr 90px}}

/* ---------- receipt ---------- */
.receipt{font-family:var(--f-mono);font-size:13px;line-height:1.5;background:#fff;color:#111;border:1px solid var(--line);border-radius:8px;padding:16px;max-width:320px;margin:0 auto;width:100%}
.receipt .c{text-align:center}
.receipt .t{font-family:var(--f-display);font-size:22px;line-height:1.1}
.receipt hr{border:0;border-top:1px dashed #999;margin:8px 0}
.receipt .l{display:flex;justify-content:space-between;gap:8px}
.receipt .big{font-weight:600;font-size:15px}
#print{display:none}
@media print{
  @page{size:58mm auto;margin:2mm}
  body{background:#fff}
  #app,.overlay,.toast,body::before{display:none!important}
  #print{display:block}
  #print .receipt{border:0;max-width:none;padding:0;font-size:11px}
}

#app{min-height:100%}
::selection{background:var(--ink);color:var(--bg)}
/* logo */
.logo{display:block;width:100%;height:auto}
.side .logo-wrap{padding:4px 10px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:14px}
.side .logo-wrap small{display:block;text-align:center;margin-top:8px;font:600 10px/1 var(--f-display);letter-spacing:.34em;text-transform:uppercase;color:var(--gold-soft)}
.topbar .logo{width:auto;height:40px}
/* type */
.page-head h1{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.14em;text-transform:uppercase;line-height:1.15}
.page-head .sub{margin-top:4px}
.cart-h h2,.modal-h h2{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.14em;text-transform:uppercase}
.card-h h3{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase}
.lbl,.field label,th,.kpi .k{font-family:var(--f-display);font-weight:600;letter-spacing:.16em}
/* calm surfaces, crisp corners */
.card,.kpi,.prod,.modal,.btn,.input,.seg,.chip,.pill,.stepper,.change,.thumb,.toast,.cartfab,.pickbranch button,.photo-pick .pv,.vblock,.variant-pick button{border-radius:3px}
.seg button{border-radius:2px}
.btn{font-weight:500;letter-spacing:.04em;border-color:var(--line-2)}
.btn.primary,.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.primary:hover{filter:none;opacity:.86}
.seg button.on,.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip{font-family:var(--f-display);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:12px;padding:8px 14px}
.pill{font-weight:500}
/* sidebar: black lacquer, jaali, mandala corner */
.side{background-color:var(--side);background-image:var(--mandala),var(--jaali);background-repeat:no-repeat,repeat;background-size:280px 280px,48px 48px;background-position:-100px calc(100% + 100px),0 0;border-right:1px solid #1c1b19}
.nav{border-radius:2px;font-weight:500;letter-spacing:.05em;border-left:2px solid transparent}
.nav:hover{background:rgba(255,255,255,.05)}
.nav.on{background:rgba(255,255,255,.08);color:#fff;border-left-color:#fff}
.whoami{border-top-color:rgba(255,255,255,.08)}
.whoami .r{color:var(--gold-soft);letter-spacing:.26em;font-family:var(--f-display);font-weight:600}
.whoami button,.branchsel{border-radius:2px}
.branchbox .lbl{font-size:10px}
.branchsel{background:rgba(255,255,255,.06)}
.branchfix{color:#fff}
.topbar{background-color:var(--side);background-image:var(--jaali);background-size:48px 48px;padding-block:6px}
.tabbar button.on svg{color:var(--ink)}
.tabbar button.on{color:var(--ink)}
.tabbar button.on span{border-bottom:1.5px solid var(--ink)}
/* login: logo on black, mandala corners */
.auth{min-height:100vh;min-height:100dvh;align-content:center;gap:22px;background-color:var(--side);background-image:var(--mandala),var(--mandala),var(--jaali);background-repeat:no-repeat,no-repeat,repeat;background-size:440px 440px,440px 440px,48px 48px;background-position:-170px -170px,calc(100% + 170px) calc(100% + 170px),0 0}
.auth-logo{width:min(330px,80vw);height:auto;display:block;margin:0 auto}
.auth-card{border-radius:3px;box-shadow:0 30px 80px rgba(0,0,0,.5);max-width:390px}
.auth-head{border-bottom:0;padding:0}
.auth-head .ttl{font:700 14px/1 var(--f-display);letter-spacing:.24em;text-transform:uppercase;text-align:center;display:flex;align-items:center;gap:10px}
.auth-head .ttl::before,.auth-head .ttl::after{content:"";flex:1;height:14px;background:var(--flower-ink) center/14px 14px no-repeat,linear-gradient(var(--line-2),var(--line-2)) center/100% 1px no-repeat}
/* category banner, like the menu board ribbons */
.cat-title{font:700 15px/1 var(--f-display);letter-spacing:.2em;text-transform:uppercase;gap:0;margin-top:10px}
.cat-title::after{display:none}
.cat-title span.ribbon{display:inline-flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);padding:11px 30px 9px;clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,14px 100%,0 50%)}
.cat-title span.ribbon::before,.cat-title span.ribbon::after{content:"";width:13px;height:13px;background:var(--flower) center/contain no-repeat}
.cat-title .rule{flex:1;height:1px;background:var(--line-2);margin-left:12px}
/* product cards */
.prod{padding:14px;gap:6px;transition:border-color .15s, box-shadow .15s, transform .08s}
.prod:hover{border-color:var(--ink);box-shadow:0 8px 22px rgba(15,15,14,.07)}
.prod .nm{font-weight:600;letter-spacing:.01em}
.prod .pr{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.02em}
.prod .pr span{font-family:var(--f-body);font-weight:500;font-size:12px;letter-spacing:.04em}
.prod.has-ph{padding-top:10px}
.prod .ph{margin:0 0 6px;width:100%;border:0;background:var(--surface-2);-webkit-mask:var(--arch) center/100% 100% no-repeat;mask:var(--arch) center/100% 100% no-repeat}
.prod .incart{background:var(--ink);color:var(--bg);border-radius:2px}
.checkout,.cart-pay{background:var(--surface-2)}
.totals .grand{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.04em;border-top:1px solid var(--line-2)}
.charge{font-family:var(--f-display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:16px}
.cartfab{background:var(--ink);color:var(--bg)}
.cartfab .amt{color:var(--gold-soft)}
/* kpis & charts */
.kpi .v{font-family:var(--f-display);font-weight:700;letter-spacing:.02em}
.kpi.hero{background-color:var(--side);background-image:var(--mandala);background-repeat:no-repeat;background-size:190px;background-position:calc(100% + 60px) -55px;color:#f4f2ee;border-color:var(--side)}
.kpi.hero .v{color:#fff}
.kpi.hero .k{color:var(--gold-soft);opacity:1}
.bar-row .fill{background:var(--ink)}
.bar-row .fill.ink{background:var(--gold)}
.bar-row .track{border-radius:0;height:6px}
.pickbranch b{font-family:var(--f-display);font-weight:700;letter-spacing:.06em}
.overlay{background:rgba(8,8,7,.62);backdrop-filter:blur(2px)}
.modal-h{border-bottom-color:var(--line)}
@media (max-width:600px){.modal{border-radius:12px 12px 0 0}}
/* receipt */
.receipt .rlogo{display:block;width:150px;height:auto;margin:0 auto 4px}
@media print{.receipt .rlogo{width:42mm}}

/* ===== cash, expenses, payroll, profit ===== */
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1000px){.kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cash-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:1000px){.cash-grid{grid-template-columns:1fr}}
.two > *{min-width:0}
.ledger{display:flex;flex-direction:column}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:15px}
.lrow.zero{color:var(--muted)}
.lrow.head{border-bottom:0;padding-bottom:2px;font-weight:700}
.lrow.sub span:first-child{padding-left:14px;color:var(--muted)}
.lrow.strong{font-weight:700}
.lrow.total{border-bottom:0;border-top:1.5px solid var(--ink);margin-top:6px;padding-top:12px;font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.03em}
.lrow.total.neg{color:var(--chili)}
.card-f{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.act .arow{display:flex;justify-content:space-between;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line)}
.act .arow:last-child{border-bottom:0}
.act .muted{font-size:13px}
.act .sm{font-size:12px}
.act .r{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right;flex:none}
.neg{color:var(--chili);font-weight:700}
.pos{color:var(--good);font-weight:700}
.change.over{background:var(--warn-soft);color:var(--warn)}
.denoms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}
.denom{display:grid;grid-template-columns:62px 1fr 64px;align-items:center;gap:8px}
.denom span:last-child{text-align:right;font-size:13px}
@media (max-width:420px){.denoms{grid-template-columns:1fr}}
.drawer-note{background:var(--warn-soft);color:var(--warn);padding:9px 12px;border-radius:3px;font-size:14px}
.drawer-note a{color:inherit;font-weight:700}
.paygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px}
.paycard{background:var(--surface);border:1px solid var(--line);border-radius:3px;display:flex;flex-direction:column;min-width:0}
.pc-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.pc-b{padding:12px 14px;display:flex;flex-direction:column;gap:10px;flex:1}
.pc-f{padding:10px 14px;border-top:1px solid var(--line);display:flex;justify-content:flex-end}
.pc-f .btn.primary{width:100%}
.netline{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.03em;padding-top:8px;border-top:1px solid var(--line-2)}
.tabs-seg{width:min(100%,420px)}
.tabs-seg button{white-space:nowrap}
.mi{display:inline-grid;place-items:center;width:22px;height:22px}
.mi svg{width:20px;height:20px}
.li.namecell,.li .namecell{gap:10px}
</style>
</head>

/* photos: shrink on the phone before upload (max 900px JPEG) */
async function shrinkImage(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => bad(new Error('That file is not a readable picture. Try a JPG or PNG.')); i.src = url; });
    const k = Math.min(1, 900 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth*k); c.height = Math.round(img.naturalHeight*k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.82));
  } finally { URL.revokeObjectURL(url); }
}
async function uploadPhoto(folder, id, blob, upsert = true){
  const path = `${folder}/${id}-${Date.now()}.jpg`;
  const { error } = await sb.storage.from('photos').upload(path, blob, { contentType:'image/jpeg', upsert });
  if (error) throw error;
  return sb.storage.from('photos').getPublicUrl(path).data.publicUrl;
}

function toast(msg, bad=false){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t = document.createElement('div'); t.className = 'toast' + (bad?' bad':''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), bad?4200:2600);
}
function errMsg(e){ return e?.message || e?.error_description || String(e); }

const variantsOf = pid => S.variants.filter(v => v.product_id === pid);
const itemById = id => S.items.find(i => i.id === id);
const branchById = id => S.branches.find(b => b.id === id);
const branchName = id => branchById(id)?.name || '—';
const activeBranches = () => S.branches.filter(b => b.active);
/* current working branch: a number, or null when an admin views "All branches" */
const curBranch = () => S.branchSel === 'all' ? null : S.branchSel;
function stockOf(itemId, branchId = curBranch()){
  const r = S.stock.find(x => x.item_id === itemId && x.branch_id === branchId);
  return r || { branch_id:branchId, item_id:itemId, qty:0, reorder_level:itemById(itemId)?.default_reorder_level || 0 };
}
function servingsLeft(variantId){
  const b = curBranch(); if (!b) return null;
  const rs = S.recipes.filter(r => r.variant_id === variantId);
  if (!rs.length) return null;
  return Math.min(...rs.map(r => Math.floor(Number(stockOf(r.item_id, b).qty) / Number(r.qty))));
}
function stockStatus(row){
  const qn = Number(row.qty), rl = Number(row.reorder_level);
  if (qn <= 0) return ['Out','bad'];
  if (qn <= rl) return ['Low','warn'];
  return ['OK','good'];
}
function initBranch(){
  if (!isAdmin()){ S.branchSel = S.me.branch_id; return; }
  let saved = null; try { saved = localStorage.getItem('is_branch'); } catch(_){}
  const ok = saved === 'all' || activeBranches().some(b => String(b.id) === saved);
  S.branchSel = ok ? (saved === 'all' ? 'all' : Number(saved)) : (activeBranches().length === 1 ? activeBranches()[0].id : 'all');
}
function setBranch(v){
  S.branchSel = v === 'all' ? 'all' : Number(v);
  try { localStorage.setItem('is_branch', String(S.branchSel)); } catch(_){}
  document.querySelectorAll('.branchsel').forEach(sel => sel.value = String(S.branchSel));
  route();
}

async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) return showAuth();
  try {
    const me = await q(sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle());
    if (!me || !me.active){ await sb.auth.signOut(); return showAuth('This account is deactivated. Ask the admin.'); }
    S.me = me;
    await loadCatalog();
    if (me.role === 'sales' && !branchById(me.branch_id)?.active){ await sb.auth.signOut(); return showAuth('Your account has no active branch. Ask the admin to assign one.'); }
    initBranch();
  } catch(e){ return showAuth('Could not load the POS: ' + errMsg(e)); }
  renderShell();
  route();
}

function renderProducts(){
  const term = S.q.trim().toLowerCase();
  const cats = S.cat === 'All' ? CATS : [S.cat];
  let html = '';
  for (const c of cats){
    const ps = S.products.filter(p => p.active && p.category === c && (!term || p.name.toLowerCase().includes(term)) && variantsOf(p.id).some(v=>v.active));
    if (!ps.length) continue;
    html += `<h2 class="cat-title"><span class="ribbon">${c}</span><span class="rule"></span></h2><div class="grid">` + ps.map(p => {
      const vs = variantsOf(p.id).filter(v => v.active);
      const left = vs.map(v => servingsLeft(v.id)).filter(x => x !== null);
      const min = left.length ? Math.min(...left) : null;
      const tag = min === null ? '' : min <= 0 ? '<span class="pill bad tag">Out of stock</span>' : min <= 5 ? `<span class="pill warn tag">${min} left</span>` : '';
      const inCart = S.cart.filter(l => vs.some(v => v.id === l.variant_id)).reduce((a,l) => a + l.qty, 0);
      const price = vs.length === 1 ? pesoShort(vs[0].price) : vs.map(v => `<span>${esc(v.label)}</span> ${pesoShort(v.price)}`).join('<span> · </span>');

function addToCart(variantId){
  const v = S.variants.find(x => x.id === variantId); const p = S.products.find(x => x.id === v.product_id);
  const line = S.cart.find(l => l.variant_id === variantId);
  if (line) line.qty++; else S.cart.push({ variant_id:v.id, name:p.name, label:v.label, price:Number(v.price), qty:1 });
  const left = servingsLeft(variantId);
  if (left !== null && (line?.qty || 1) > left) toast(left <= 0 ? `Heads up: ${p.name}${v.label?' '+v.label:''} shows out of stock at ${branchLabel()}.` : `Heads up: stock shows only ${left} left for ${p.name}${v.label?' '+v.label:''}.`);
  renderProducts(); renderCart();
}
function cartTotals(){
  const sub = round2(S.cart.reduce((a,l) => a + l.qty*l.price, 0));
  let disc = 0;
  if (S.co.discType === 'senior_pwd') disc = round2(sub*0.20);
  else if (S.co.discType === 'promo') disc = Math.min(Math.max(Number(S.co.discAmt)||0,0), sub);
  const total = round2(sub - disc);
  const tendered = S.co.method === 'Cash' ? Number(S.co.tendered)||0 : total;
  return { sub, disc, total, tendered, change: round2(tendered - total), count:S.cart.reduce((a,l)=>a+l.qty,0) };
}

function rangeDates(r = S.rep){
  const t = manilaDate();
  if (r.range==='lastmonth') { const last = addDays(t.slice(0,8)+'01', -1); return [last.slice(0,8)+'01', last]; }
  if (r.range==='today') return [t,t];
  if (r.range==='yesterday') { const y = addDays(t,-1); return [y,y]; }
  if (r.range==='7d') return [addDays(t,-6), t];
  if (r.range==='month') return [t.slice(0,8)+'01', t];
  return [r.from || t, r.to || t];
}
function viewReports(){
  const r = S.rep; const [f,t] = rangeDates();
  main().innerHTML = `<div class="page">
    <div class="page-head"><div><h1>Sales Report</h1><div class="sub" id="rp_sub">${esc(branchLabel())} · ${f===t ? fmtDay(f) : fmtDay(f)+' – '+fmtDay(t)}</div></div><span class="spacer"></span>
      <button class="btn" data-act="csv">Export CSV</button></div>
    <div class="rangebar">${[['today','Today'],['yesterday','Yesterday'],['7d','Last 7 days'],['month','This month'],['custom','Custom']].map(([k,l]) => `<button class="chip ${r.range===k?'on':''}" data-act="range" data-v="${k}">${l}</button>`).join('')}
      ${r.range==='custom' ? `<input class="input" type="date" id="rp_from" value="${f}" style="max-width:160px"><span class="muted">to</span><input class="input" type="date" id="rp_to" value="${t}" style="max-width:160px">` : ''}</div>
    <div id="rp"><div class="empty">Crunching the numbers…</div></div>
  </div>`;
  if (r.range==='custom'){ const h = () => { S.rep.from = document.getElementById('rp_from').value; S.rep.to = document.getElementById('rp_to').value; if (S.rep.from && S.rep.to) viewReports(); };
    document.getElementById('rp_from').onchange = h; document.getElementById('rp_to').onchange = h; }
  loadReport();

async function loadReport(){
  let [f,t] = rangeDates(); if (f > t) [f,t] = [t,f];
  try {
    const sales = await fetchAll(() => { let x = sb.from('sales').select('*, sale_items(*)').gte('created_at', dayStart(f).toISOString()).lt('created_at', dayStart(addDays(t,1)).toISOString()).order('created_at').order('id'); if (curBranch()) x = x.eq('branch_id', curBranch()); return x; });
    S.repData = { f, t, sales }; await refreshStock(); renderReport();
  } catch(e){ document.getElementById('rp').innerHTML = `<div class="empty">Could not load the report: ${esc(errMsg(e))}</div>`; }
}
function sumBy(arr, keyFn, valFn){ const m = new Map(); arr.forEach(x => { const k = keyFn(x); m.set(k, (m.get(k)||0) + valFn(x)); }); return m; }
function barList(map, opt={}){
  const rows = [...map.entries()].sort((a,b) => b[1]-a[1]); const max = Math.max(...rows.map(r=>r[1]), 1);
  if (!rows.length) return '<div class="muted">No data.</div>';
  return `<div class="bars">${rows.map(([k,v]) => `<div class="bar-row"><span>${esc(k)}</span><div class="track"><div class="fill ${opt.ink?'ink':''}" style="width:${(v/max*100).toFixed(1)}%"></div></div><b class="num">${opt.count?qtyFmt(v):peso(v,0)}</b></div>`).join('')}</div>`;
}
function columnChart(labels, values, sub){
  const W = 640, H = 220, padL = 46, padB = 26, padT = 12, n = labels.length; const max = Math.max(...values, 1);
  const nice = (() => { const p = Math.pow(10, Math.floor(Math.log10(max))); const s = [1,2,2.5,5,10].find(x => x*p >= max); return s*p; })();
  const bw = (W - padL - 8) / n; const y = v => padT + (H - padT - padB) * (1 - v/nice);
  let g = '';
  for (let i=0;i<=4;i++){ const v = nice*i/4; g += `<line x1="${padL}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${padL-6}" y="${y(v)+4}" text-anchor="end">${v>=1000?(v/1000)+'k':v}</text>`; }
  const step = Math.ceil(n/12);
  values.forEach((v,i) => { const x = padL + i*bw + bw*.15, w = bw*.7;
    g += `<rect x="${x}" y="${y(v)}" width="${w}" height="${Math.max(0,H-padB-y(v))}" rx="2" fill="${v===Math.max(...values)&&v>0?'var(--gold)':'var(--ink)'}"><title>${labels[i]}: ${peso(v)}</title></rect>`;
    if (i % step === 0) g += `<text x="${x+w/2}" y="${H-8}" text-anchor="middle">${labels[i]}</text>`; });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(sub)}">${g}</svg></div>`;
}
function renderReport(){
  const { f, t, sales } = S.repData;
  const ok = sales.filter(s => s.status==='completed'); const voids = sales.filter(s => s.status==='void');
  const net = ok.reduce((a,s)=>a+Number(s.total),0), gross = ok.reduce((a,s)=>a+Number(s.subtotal),0), disc = ok.reduce((a,s)=>a+Number(s.discount),0);
  const lines = ok.flatMap(s => s.sale_items);
  const itemsSold = lines.reduce((a,l)=>a+l.qty,0);
  // trend
  let chart, chartTitle;
  if (f === t){
    const hrs = ok.map(s => hourOf(s.created_at)); const lo = Math.min(9, ...hrs), hi = Math.max(21, ...hrs);
    const labels = [], vals = [];
    for (let h=lo; h<=hi; h++){ labels.push((h%12||12)+(h<12?'a':'p')); vals.push(ok.filter(s => hourOf(s.created_at)===h).reduce((a,s)=>a+Number(s.total),0)); }
    chart = columnChart(labels, vals, 'Sales by hour'); chartTitle = 'Sales by hour';
  } else {
    const labels = [], vals = []; let d = f, guard = 0;
    while (d <= t && guard++ < 400){ labels.push(dayStart(d).toLocaleDateString('en-PH',{timeZone:TZ,month:'short',day:'numeric'})); vals.push(ok.filter(s => manilaDate(new Date(s.created_at))===d).reduce((a,s)=>a+Number(s.total),0)); d = addDays(d,1); }
    chart = columnChart(labels, vals, 'Sales by day'); chartTitle = 'Sales by day';
  }
  const items = new Map(); lines.forEach(l => { const k = l.product_name + (l.variant_label ? ' · ' + l.variant_label : ''); const o = items.get(k) || { q:0, r:0, c:l.category }; o.q += l.qty; o.r += Number(l.line_total); items.set(k, o); });
  const top = [...items.entries()].sort((a,b) => b[1].r - a[1].r);
  const cashiers = new Map(); ok.forEach(s => { const o = cashiers.get(s.cashier_id) || { n:0, v:0 }; o.n++; o.v += Number(s.total); cashiers.set(s.cashier_id, o); });
  const low = []; (curBranch() ? [curBranch()] : activeBranches().map(b => b.id)).forEach(bid => S.items.filter(i => i.active).forEach(i => { const r = stockOf(i.id, bid); if (stockStatus(r)[0] !== 'OK') low.push({ i, r, bid }); }));
  const byBranch = sumBy(ok, s => branchName(s.branch_id), s => Number(s.total));
  const senior = ok.filter(s => s.discount_type==='senior_pwd');
  document.getElementById('rp').innerHTML = `
    <div class="kpis">
      <div class="kpi hero"><span class="k">Net sales</span><span class="v num">${peso(net)}</span><span class="s num">Gross ${peso(gross)}</span></div>
      <div class="kpi"><span class="k">Orders</span><span class="v num">${ok.length}</span><span class="s num">${itemsSold} items sold</span></div>

/* ===================== CASH ON HAND ===================== */
const DENOMS = [1000,500,200,100,50,20];
async function viewCash(){
  const today = manilaDate();
  S.cashDate = !S.cashDate || S.cashDate > today ? today : S.cashDate;
  main().innerHTML = `<div class="page">
    <div class="page-head"><div><h1>Cash On Hand</h1><div class="sub">${esc(branchLabel())} · the cash drawer: starting cash, cash sales and every peso paid out.</div></div></div>
    <div class="row">
      <button class="btn sm" data-act="cday" data-d="-1" aria-label="Previous day">‹</button>
      <input class="input" id="cash_date" type="date" style="max-width:170px" value="${S.cashDate}" max="${today}">
      <button class="btn sm" data-act="cday" data-d="1" aria-label="Next day" ${S.cashDate>=today?'disabled':''}>›</button>
      ${S.cashDate!==today ? '<button class="btn sm ghost" data-act="ctoday">Today</button>' : ''}
    </div>
    <div id="cashBody"><div class="card empty">Loading the drawer…</div></div></div>`;
  document.getElementById('cash_date').onchange = e => { S.cashDate = e.target.value && e.target.value <= today ? e.target.value : today; viewCash(); };
  const b = curBranch();
  if (!b) return renderCashAll();
  try {
    const [sm, moves, exps] = await Promise.all([
      q(sb.rpc('cash_summary', { p_branch:b, p_date:S.cashDate })),
      q(sb.from('cash_moves').select('*').eq('branch_id', b).eq('move_date', S.cashDate).order('created_at')),
      q(sb.from('expenses').select('*').eq('branch_id', b).eq('expense_date', S.cashDate).eq('paid_from','drawer').order('created_at'))
    ]);
    let pays = [], advs = [];
    if (isAdmin()) [pays, advs] = await Promise.all([
      q(sb.from('payroll_entries').select('*').eq('branch_id', b).eq('work_date', S.cashDate).eq('paid_from','drawer')),
      q(sb.from('cash_advances').select('*').eq('branch_id', b).eq('advance_date', S.cashDate).eq('paid_from','drawer'))]);
    S.cash = { sm, moves, exps, pays, advs };
    renderCash();
  } catch(e){ document.getElementById('cashBody').innerHTML = `<div class="card empty">Could not load the drawer: ${esc(errMsg(e))}</div>`; }
}
function renderCash(){
  const { sm } = S.cash; const s = sm.session; const isToday = S.cashDate === manilaDate();
  const canAct = isAdmin() || isToday; const closed = s && s.status === 'closed';
  const status = !s ? ['Not opened','mute'] : closed ? ['Closed','mute'] : ['Open','good'];
  const ledger = [['Starting cash', sm.opening, 1], ['Cash sales', sm.cash_sales, 1], ['Cash in', sm.cash_in, 1],
    ['Expenses paid from drawer', sm.expenses, -1], ['Payroll paid from drawer', sm.payroll, -1], ['Cash advances', sm.advances, -1], ['Cash out', sm.cash_out, -1]];
  const expected = closed ? N0(s.expected_cash) : N0(sm.expected);
  let html = '';
  if (!s) html += canAct ? `<div class="card"><div class="card-h"><h3>Open the drawer</h3></div><div class="card-b" style="display:flex;flex-direction:column;gap:12px;max-width:440px">
      <div class="muted" style="font-size:14px">Count the cash in the drawer before the first sale.${N0(sm.suggested_opening) ? ` The last closing left <b>${peso(sm.suggested_opening)}</b> in the drawer.` : ''}</div>
      <div class="field"><label for="op_cash">Starting cash (₱)</label><input class="input num" id="op_cash" type="number" inputmode="decimal" min="0" step="any" value="${N0(sm.suggested_opening) || ''}" placeholder="e.g. 1000"></div>
      <button class="btn primary" data-act="opencash">Open drawer</button></div></div>`
    : '<div class="card empty">The drawer was not opened on this day.</div>';
  html += `<div class="cash-grid">
    <div class="card"><div class="card-h"><h3>${closed ? 'Closing summary' : 'Expected cash on hand'}</h3><span class="spacer"></span><span class="pill ${status[1]}">${status[0]}</span></div>
      <div class="card-b"><div class="ledger">
        ${ledger.map(([l,v,sg]) => `<div class="lrow ${N0(v)?'':'zero'}"><span>${l}</span><span class="num">${sg<0?'−':'+'} ${peso(v)}</span></div>`).join('')}
        <div class="lrow total"><span>Expected cash</span><span class="num">${peso(expected)}</span></div>
        ${closed ? `<div class="lrow"><span>Counted cash</span><span class="num"><b>${peso(s.counted_cash)}</b></span></div>
          <div class="lrow"><span>${varLabel(s.variance)}</span><span class="pill ${varClass(s.variance)} num">${Number(s.variance) ? peso(Math.abs(s.variance)) : 'Exact'}</span></div>
          <div class="lrow"><span>Turned over to owner</span><span class="num">${peso(s.turnover)}</span></div>
          <div class="lrow"><span>Left in drawer for the next day</span><span class="num"><b>${peso(s.carry_over)}</b></span></div>` : ''}
      </div>
      ${s ? `<div class="muted" style="font-size:13px;margin-top:10px">Opened ${fmtTime(s.opened_at)} by ${esc(nameOf(s.opened_by))}${s.closed_at ? ` · closed ${fmtTime(s.closed_at)} by ${esc(nameOf(s.closed_by))}` : ''}${s.close_note ? ` · “${esc(s.close_note)}”` : ''}</div>` : ''}</div>
      ${s && !closed && canAct ? `<div class="card-f"><button class="btn" data-act="cashmove" data-v="in">+ Cash in</button><button class="btn" data-act="cashmove" data-v="out">− Cash out</button>
        <button class="btn" data-act="quickexp">Record expense</button><span class="spacer"></span><button class="btn primary" data-act="closecash">Close drawer</button></div>` : ''}
      ${closed && isAdmin() ? '<div class="card-f"><button class="btn" data-act="reopencash">Reopen drawer</button></div>' : ''}
    </div>
    <div class="card"><div class="card-h"><h3>Drawer activity</h3></div>${activityList()}</div>
  </div>`;
  document.getElementById('cashBody').innerHTML = html;
}
function activityList(){
  const { moves, exps, pays, advs, sm } = S.cash; const closed = sm.session?.status === 'closed';
  const rows = [
    ...moves.map(m => ({ t:m.created_at, k:m.direction==='in' ? 'Cash in' : 'Cash out', d:m.reason + (m.note ? ' · ' + m.note : ''), a:(m.direction==='in'?1:-1)*N0(m.amount), by:m.created_by, del:isAdmin() && !closed ? m.id : null })),
    ...exps.map(x => ({ t:x.created_at, k:'Expense', d:x.category + ' · ' + x.description, a:-N0(x.amount), by:x.created_by })),
    ...pays.map(x => ({ t:x.created_at, k:'Payroll', d:nameOf(x.profile_id) + (Number(x.days)===0.5 ? ' · half day' : ''), a:-N0(x.net_pay), by:x.created_by })),

function updateClose(){
  let c = 0;
  DENOMS.forEach(d => { const n = Math.max(0, Math.floor(N0(document.getElementById('den_'+d).value))); c += n*d; document.getElementById('dv_'+d).textContent = pesoShort(n*d); });
  c = round2(c + Math.max(0, N0(document.getElementById('den_coins').value)));
  const exp = N0(S.cash.sm.expected), v = round2(c - exp);
  document.getElementById('cl_count').textContent = peso(c);
  const el = document.getElementById('cl_var'); el.className = 'change num' + (v < 0 ? ' short' : v > 0 ? ' over' : '');
  el.innerHTML = `<span>${v===0 ? 'Balanced' : v>0 ? 'Over by' : 'Short by'}</span><span>${peso(Math.abs(v))}</span>`;
  const t = document.getElementById('cl_turn');
  if (!S.clTurnDirty){ const open = N0(S.cash.sm.opening); t.value = c > open ? round2(c - open) : 0; }
  document.getElementById('cl_left').textContent = peso(round2(c - N0(t.value)));
  S.clCount = c;
}
async function saveClose(btn){
  const turn = N0(document.getElementById('cl_turn').value);

  const den = {}; DENOMS.forEach(d => { const n = Math.floor(N0(document.getElementById('den_'+d).value)); if (n > 0) den[d] = n; });
  const coins = N0(document.getElementById('den_coins').value); if (coins) den.coins = coins;
  btn.disabled = true;
  try { await q(sb.rpc('close_cash', { p_branch:curBranch(), p_date:S.cashDate, p_counted:S.clCount, p_denoms:den, p_turnover:turn, p_note:document.getElementById('cl_note').value }));

const payCost = x => N0(x.net_pay) + N0(x.advance_deduct);
function signedChart(labels, values){
  const W = 640, H = 230, padL = 52, padB = 26, padT = 14, n = labels.length;
  const mx = Math.max(0, ...values), mn = Math.min(0, ...values); const raw = ((mx - mn) || 1) / 4;
  const p10 = Math.pow(10, Math.floor(Math.log10(raw))); const step = [1,2,2.5,5,10].find(x => x*p10 >= raw) * p10;
  const top = Math.ceil(mx / step) * step || step, bot = Math.floor(mn / step) * step; const span = top - bot;
  const y = v => padT + (H - padT - padB) * (top - v) / span; const bw = (W - padL - 8) / n;
  const kf = v => Math.abs(v) >= 1000 ? (v/1000).toLocaleString('en-PH', { maximumFractionDigits:1 }) + 'k' : String(Math.round(v));
  let g = '';
  for (let i = 0; i <= Math.round(span / step); i++){ const v = bot + i*step;
    g += `<line x1="${padL}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}" stroke="${Math.abs(v) < 1e-9 ? 'var(--ink)' : 'var(--line)'}" stroke-width="1"/><text x="${padL-6}" y="${y(v)+4}" text-anchor="end">${kf(v)}</text>`; }
  const every = Math.ceil(n / 12);
  values.forEach((v,i) => { const x = padL + i*bw + bw*.16, w = Math.max(1, bw*.68), y0 = y(Math.max(v,0)), h = Math.abs(y(v) - y(0));
    g += `<rect x="${x}" y="${y0}" width="${w}" height="${v ? Math.max(h, 1) : 0}" fill="${v < 0 ? 'var(--chili)' : 'var(--ink)'}"><title>${labels[i]}: ${v < 0 ? 'loss ' : 'profit '}${peso(Math.abs(v))}</title></rect>`;
    if (i % every === 0) g += `<text x="${x + w/2}" y="${H-8}" text-anchor="middle">${labels[i]}</text>`; });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Net profit by period">${g}</svg></div>`;
}

  const brRows = curBranch() ? [] : S.branches.map(b => { const s = sales.filter(x => x.branch_id === b.id).reduce((a,x) => a + N0(x.total), 0), e = exps.filter(x => x.branch_id === b.id).reduce((a,x) => a + N0(x.amount), 0), p = pays.filter(x => x.branch_id === b.id).reduce((a,x) => a + payCost(x), 0);

      <div class="kpi"><span class="k">Profit margin</span><span class="v num ${profit < 0 ? 'neg' : ''}">${salesT ? margin.toFixed(1) + '%' : '—'}</span><span class="s">${profit < 0 ? 'Costs are higher than sales' : `Of every ₱100 sold, ₱${margin.toFixed(0)} is profit`}</span></div></div>
    <div class="two">
      <div class="card"><div class="card-h"><h3>Profit &amp; loss</h3></div><div class="card-b"><div class="ledger pl">
        <div class="lrow strong"><span>Sales <span class="muted">(after discounts, voids removed)</span></span><span class="num">${peso(salesT)}</span></div>
        <div class="lrow head"><span>Expenses</span><span></span></div>
        ${byCat.map(([c,v]) => `<div class="lrow sub"><span>${esc(c)}</span><span class="num">− ${peso(v)}</span></div>`).join('') || '<div class="lrow sub zero"><span>No expenses recorded</span><span class="num">− ₱0.00</span></div>'}
        <div class="lrow"><span>Total expenses</span><span class="num">− ${peso(expT)}</span></div>

        <div class="lrow total ${profit < 0 ? 'neg' : ''}"><span>${profit < 0 ? 'Net loss' : 'Net profit'}</span><span class="num">${profit < 0 ? '−' : ''}${peso(Math.abs(profit))}</span></div></div>
        <div class="muted" style="font-size:12px;margin-top:12px">Payroll is the pay earned for each day worked, including any part kept back to repay a cash advance. A cash advance on its own is a loan, so it is not an expense.</div></div></div>
      <div class="card"><div class="card-h"><h3>${monthly ? 'Profit by month' : 'Profit by day'}</h3><span class="spacer"></span><span class="muted" style="font-size:13px">Red is a loss</span></div>
        <div class="card-b">${keys.length > 1 && (salesT || expT || payT) ? signedChart(labels, S.prData.rows.map(r => r.profit)) : `<div class="empty">${keys.length > 1 ? 'Nothing recorded in this period yet.' : 'Pick a longer period to see profit over time.'}</div>`}

    </tbody></table></div></div>` : ''}`;

function profitCSV(){
  const d = S.prData; if (!d?.rows) return;
  const rows = [['Period','Sales','Expenses','Payroll','Net profit']].concat(d.rows.map(r => [r.label, r.s.toFixed(2), r.e.toFixed(2), r.p.toFixed(2), r.profit.toFixed(2)]));
  const T = d.rows.reduce((a,r) => ({ s:a.s + r.s, e:a.e + r.e, p:a.p + r.p }), { s:0, e:0, p:0 });
  rows.push(['TOTAL', T.s.toFixed(2), T.e.toFixed(2), T.p.toFixed(2), (T.s - T.e - T.p).toFixed(2)]);
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type:'text/csv' }));
  a.download = `indiana-spice-profit_${curBranch() ? branchById(curBranch()).code.toLowerCase() : 'all'}_${d.f}_to_${d.t}.csv`; document.body.appendChild(a); a.click(); a.remove();
}

  closeModal();
  const o = document.createElement('div'); o.className = 'overlay';
  o.innerHTML = `<div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true">${html}</div>`;
  o.addEventListener('mousedown', e => { if (e.target === o) closeModal(); });
  document.body.appendChild(o);
  setTimeout(() => o.querySelector('input:not([type=checkbox]),select')?.focus(), 30);
}
function closeModal(){ document.querySelectorAll('.overlay').forEach(o => o.remove()); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ===================== events ===================== */
document.addEventListener('click', async e => {
  const nav = e.target.closest('button[data-nav]');
  if (nav){ location.hash = nav.dataset.nav; return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  switch (a){
    case 'signout': return signOut();
    case 'cat': S.cat = el.dataset.v; document.querySelectorAll('[data-act=cat]').forEach(c => c.classList.toggle('on', c.dataset.v === S.cat)); return renderProducts();
    case 'pick': {
      const vs = variantsOf(Number(el.dataset.pid)).filter(v => v.active);
      if (vs.length === 1) return addToCart(vs[0].id);
      const p = S.products.find(x => x.id == el.dataset.pid);
      return openModal(`<div class="modal-h"><h2>${esc(p.name)}</h2></div><div class="modal-b"><div class="variant-pick">${vs.map(v => { const l = servingsLeft(v.id);
        return `<button data-act="pickv" data-v="${v.id}"><span>${esc(v.label)}</span><b class="num">${pesoShort(v.price)}</b>${l!==null?`<span class="pill ${l<=0?'bad':l<=5?'warn':'mute'}">${l<=0?'Out':l+' left'}</span>`:''}</button>`; }).join('')}</div></div>`);
    }
    case 'pickv': closeModal(); return addToCart(Number(el.dataset.v));
    case 'inc': S.cart[el.dataset.i].qty++; renderProducts(); return renderCart();
    case 'dec': { const l = S.cart[el.dataset.i]; if (--l.qty <= 0) S.cart.splice(el.dataset.i,1); renderProducts(); return renderCart(); }
    case 'rm': S.cart.splice(el.dataset.i,1); renderProducts(); return renderCart();
    case 'clearcart': S.cart = []; renderProducts(); return renderCart();
    case 'co': S.co[el.dataset.k] = el.dataset.v; return renderCart();
    case 'cash': S.co.tendered = el.dataset.v; return renderCart();
    case 'opencart': S.cartOpen = true; return document.getElementById('cart').classList.add('open');
    case 'closecart': S.cartOpen = false; return document.getElementById('cart').classList.remove('open');
    case 'charge': return charge(el);
    case 'print': return window.print();
    case 'close': return closeModal();
    case 'sday': S.salesDate = addDays(S.salesDate, Number(el.dataset.d)); document.getElementById('sl_date').value = S.salesDate; return loadSales();
    case 'opensale': return openSale(id);
    case 'askvoid': document.getElementById('voidBox').hidden = false; el.hidden = true; return document.getElementById('v_reason').focus();
    case 'cancelvoid': document.getElementById('voidBox').hidden = true; document.querySelector('[data-act=askvoid]').hidden = false; return;
    case 'dovoid': return doVoid(id, el);
    case 'invtab': S.invTab = el.dataset.v; return viewInventory();
    case 'togglehidden': S.showHidden = !S.showHidden; return viewInventory();
    case 'stock': return stockModal(id);
    case 'sttype': { const o = document.querySelector('.overlay'); o.dataset.st = el.dataset.v; document.querySelectorAll('[data-act=sttype]').forEach(b => b.classList.toggle('on', b===el));
      const it = document.querySelector('[data-act=savestock]'); const unit = itemById(Number(it.dataset.id)).unit;
      document.getElementById('st_lbl').textContent = { restock:`Quantity added (${unit})`, waste:`Quantity wasted (${unit})`, adjust:`Actual count on hand (${unit})` }[el.dataset.v];
      o.prevStock && o.prevStock(); return; }
    case 'savestock': return saveStock(id, el);
    case 'newitem': return itemModal(null);
    case 'edititem': return itemModal(id);
    case 'saveitem': return saveItem(id, el);
    case 'editprod': return prodModal(id || null);
    case 'addvar': syncDraft(); S.draft.variants.push({ label:'', price:'', active:true, recipe:[] }); return renderVariants();
    case 'rmvar': syncDraft(); S.draft.variants.splice(el.dataset.vi,1); return renderVariants();
    case 'addrec': syncDraft(); if (!S.items.length) return toast('Add a stock item first in Inventory.', true); S.draft.variants[el.dataset.vi].recipe.push({ item_id:(S.items.find(i => i.active) || S.items[0]).id, qty:1 }); return renderVariants();
    case 'rmrec': { syncDraft(); const [vi,ri] = el.dataset.ri.split('.'); S.draft.variants[vi].recipe.splice(ri,1); return renderVariants(); }
    case 'saveprod': return saveProd(id, el);
    case 'xrange': { const k = el.dataset.k; if (el.dataset.v === 'custom' && !S[k].from){ const [f,t] = rangeDates(S[k]); S[k].from = f; S[k].to = t; } S[k].range = el.dataset.v; return route(); }
    case 'cday': { const d = addDays(S.cashDate, Number(el.dataset.d)); S.cashDate = d > manilaDate() ? manilaDate() : d; return viewCash(); }
    case 'ctoday': S.cashDate = manilaDate(); return viewCash();
    case 'opencash': { const v = document.getElementById('op_cash').value; if (v === '' || Number(v) < 0) return toast('Enter the starting cash (₱0 or more).', true); el.disabled = true;
      try { await q(sb.rpc('open_cash', { p_branch:curBranch(), p_date:S.cashDate, p_opening:Number(v) })); toast('Drawer opened.'); viewCash(); } catch(err){ el.disabled = false; toast(errMsg(err), true); } return; }
    case 'cashmove': return cashMoveModal(el.dataset.v);
    case 'savemove': return saveMove(el.dataset.v, el);
    case 'closecash': return closeCashModal();
    case 'saveclose': return saveClose(el);
    case 'reopencash': if (!armed(el)) return; try { await q(sb.rpc('reopen_cash', { p_branch:curBranch(), p_date:S.cashDate })); toast('Drawer reopened.'); viewCash(); } catch(err){ toast(errMsg(err), true); } return;
    case 'delmove': if (!armed(el)) return; try { await q(sb.from('cash_moves').delete().eq('id', id)); toast('Deleted.'); viewCash(); } catch(err){ toast(errMsg(err), true); } return;
    case 'quickexp': S.openExpAdd = true; S.expDate = S.cashDate; location.hash = 'expenses'; if (S.view === 'expenses') viewExpenses(); return;
    case 'newexp': if (isAdmin() && !activeBranches().length) return toast('Add a branch first under Branches.', true); return expModal();
    case 'saveexp': return saveExp(el);
    case 'delexp': if (!armed(el)) return; try { await q(sb.from('expenses').delete().eq('id', id)); toast('Expense deleted.'); viewExpenses(); } catch(err){ toast(errMsg(err), true); } return;
    case 'paytab': S.payTab = el.dataset.v; return viewPayroll();
    case 'pday': { const d = addDays(S.payDate, Number(el.dataset.d)); S.payDate = d > manilaDate() ? manilaDate() : d; return viewPayroll(); }
    case 'payatt': payFormOf(el.dataset.pid).days = Number(el.dataset.v); return rerenderPayCard(el.dataset.pid);
    case 'paynow': return payNow(el.dataset.pid, el);
    case 'undopay': if (!armed(el)) return; try { await q(sb.from('payroll_entries').delete().eq('id', id)); toast('Payment undone.'); viewPayroll(); } catch(err){ toast(errMsg(err), true); } return;
    case 'newadv': return advModal();
    case 'saveadv': return saveAdv(el);
    case 'deladv': { if (!armed(el)) return; const a = await q(sb.from('cash_advances').select('*').eq('id', id).maybeSingle()).catch(() => null);
      if (a && advBalOf(a.profile_id) - Number(a.amount) < 0) return toast('Part of this advance was already deducted from pay. Undo those payments first.', true);
      try { await q(sb.from('cash_advances').delete().eq('id', id)); toast('Advance deleted.'); viewPayroll(); } catch(err){ toast(errMsg(err), true); } return; }
    case 'gostaff': location.hash = 'staff'; return;
    case 'profitcsv': return profitCSV();
    case 'setbranch': return setBranch(el.dataset.v);
    case 'editbranch': return branchModal(id || null);
    case 'savebranch': return saveBranch(id, el);
    case 'rmphoto': S.photo.blob = null; S.photo.remove = true; document.getElementById('ph_prev').textContent = 'No photo'; el.hidden = true; document.getElementById('ph_file').value = ''; return;
    case 'range': S.rep.range = el.dataset.v; return viewReports();
    case 'csv': return exportCSV();
    case 'newstaff': return staffModal();
    case 'savestaff': return saveStaff(el);
    case 'resetpw': return resetPwModal(id);
    case 'dopw': el.disabled = true; try { await callStaff({ action:'set_password', id, password:document.getElementById('rp_pw').value }); closeModal(); toast('Password updated.'); } catch(err){ el.disabled = false; toast(errMsg(err), true); } return;
    case 'toggleactive': { const p = S.profiles.find(x => x.id === id); el.disabled = true;
      try { await callStaff({ action:'set_active', id, active:!p.active }); toast(p.active ? 'Account deactivated.' : 'Account activated.'); viewStaff(); } catch(err){ el.disabled = false; toast(errMsg(err), true); } return; }
  }
});

document.addEventListener('change', async e => {
  const el = e.target.closest('[data-change]'); if (!el) return;
  const k = el.dataset.change;
  if (k === 'branch') return setBranch(el.value);
  if (k === 'xfrom' || k === 'xto'){ const st = S[el.dataset.k]; st[k === 'xfrom' ? 'from' : 'to'] = el.value; if (st.from && st.to) route(); return; }
  if (k === 'rate'){ const v = Number(el.value); if (el.value !== '' && !(v >= 0)) return toast('Enter a daily rate of ₱0 or more.', true);
    try { await q(sb.from('profiles').update({ daily_rate: v || 0 }).eq('id', el.dataset.id)); const p = S.profiles.find(x => x.id === el.dataset.id); if (p) p.daily_rate = v || 0; toast('Daily rate saved.'); } catch(err){ toast(errMsg(err), true); }
    return; }
  if (k === 'role' || k === 'staffbranch'){
    const p = S.profiles.find(x => x.id === el.dataset.id);
    const patch = k === 'role' ? { role:el.value } : { branch_id:Number(el.value) || null };
    if (k === 'role' && el.value === 'sales' && !p.branch_id) patch.branch_id = curBranch() || activeBranches()[0]?.id || null;
    try { await q(sb.from('profiles').update(patch).eq('id', p.id)); toast(k === 'role' ? 'Role updated.' : 'Branch updated.'); viewStaff(); } catch(err){ toast(errMsg(err), true); }
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.pf) return payInput(el);
  if (el.dataset.den){ if (el.dataset.den === 'turn') S.clTurnDirty = true; return updateClose(); }
});
sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT' && S.me){ S.me = null; showAuth(); } });
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
</script>
